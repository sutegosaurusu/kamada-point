<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新規登録</title>
</head>

<body>

<h1>新規会員登録</h1>

<input id="name" placeholder="名前"><br><br>
<input id="email" placeholder="メールアドレス"><br><br>
<input id="password" type="password" placeholder="パスワード"><br><br>

<button id="registerBtn">登録</button>

<p id="msg"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgILQJKJOiQ6gIeZPKhbVjdybXS_vsD3Q",
  authDomain: "kamadapoint.firebaseapp.com",
  databaseURL: "https://kamadapoint-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kamadapoint",
  storageBucket: "kamadapoint.firebasestorage.app",
  messagingSenderId: "601769416524",
  appId: "1:601769416524:web:0be49ce5a0baf87f75e1e9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const msg = document.getElementById("msg");

document.getElementById("registerBtn").onclick = async () => {

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (!name || !email || !password) {
    msg.textContent = "全て入力してください";
    return;
  }

  try {

    // ① Firebase Authでアカウント作成
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);

    const user = userCredential.user;

    // ② Realtime Databaseに保存
    await set(ref(db, "members/" + user.uid), {
      name: name,
      email: email,
      point: 0,
      admin: false,
      banned: false
    });

    msg.textContent = "登録成功";

    // ログイン画面へ
    setTimeout(() => {
      location.href = "login.html";
    }, 1000);

  } catch (e) {
    msg.textContent = "登録失敗: " + e.message;
  }
};

</script>

</body>
</html>
