<html lang="ja">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:14px;
    min-height:100vh;

    font-family:"Yu Mincho","Noto Serif JP",serif;
    color:#302318;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(255,255,255,.10),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(50,30,10,.10),
            transparent 45%
        ),
        #b69a70;
}

button{
    font-family:inherit;
}

/* タイトル */

header{
    width:100%;
    max-width:1000px;
    margin:0 auto 14px;
    padding:16px;

    background:#cbb58e;
    border:3px solid #5c432b;
    box-shadow:4px 4px 0 #725638;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:6px 0 0;
    color:#67513a;
    font-size:14px;
}

/* 上部情報 */

.topInfo{
    width:100%;
    max-width:1000px;
    margin:0 auto 14px;
    padding:10px 12px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;

    background:#d5c29e;
    border:2px solid #60472e;
}

.supplyInfo{
    display:flex;
    flex-wrap:wrap;
    gap:12px;

    font-size:16px;
    font-weight:bold;
}

.backButton{
    padding:8px 12px;

    border:2px solid #4c351f;
    background:#765536;
    color:#f5e7ca;

    cursor:pointer;
}

/* 見出し */

.sectionTitle{
    width:100%;
    max-width:1000px;
    margin:20px auto 9px;

    font-size:21px;
}

/* 横スクロール */

.locationScroll{
    width:100%;
    max-width:1000px;
    margin:0 auto;
    padding:8px 4px 14px;

    display:flex;
    gap:13px;

    overflow-x:auto;
    scroll-snap-type:x mandatory;
}

.locationScroll::-webkit-scrollbar{
    height:10px;
}

.locationScroll::-webkit-scrollbar-thumb{
    background:#755638;
    border-radius:10px;
}

.locationCard{
    flex:0 0 260px;
    min-height:310px;
    padding:14px;

    position:relative;

    background:#d7c4a1;
    border:3px solid #5b422b;
    box-shadow:4px 4px 0 #75593c;

    scroll-snap-align:start;
    cursor:pointer;

    transition:
        transform .15s,
        background .15s;
}

.locationCard:hover{
    transform:translateY(-3px);
}

.locationCard.selected{
    background:#ead5aa;
    border:4px solid #3d2918;
    box-shadow:5px 5px 0 #4f3824;
}

.locationIcon{
    height:100px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#bea479;
    border:2px solid #664a30;

    font-size:58px;
}

.locationName{
    margin-top:12px;
    font-size:21px;
    font-weight:bold;
}

.locationDescription{
    min-height:58px;
    margin-top:6px;

    color:#604c36;
    line-height:1.5;
    font-size:14px;
}

.difficulty{
    margin-top:10px;
    font-weight:bold;
}

.rewardHint{
    margin-top:10px;
    padding-top:8px;

    border-top:1px dashed #806749;
    font-size:13px;
}

/* 時間選択 */

.timeButtons{
    width:100%;
    max-width:1000px;
    margin:0 auto;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.timeButton{
    padding:13px 5px;

    border:2px solid #594026;
    background:#d2bd96;
    color:#382719;

    font-size:17px;
    cursor:pointer;
}

.timeButton.active{
    background:#705036;
    color:#fff0d0;
}

/* 必要物資 */

.requirementBox{
    width:100%;
    max-width:1000px;
    margin:16px auto 0;
    padding:15px;

    background:#cfb991;
    border:3px solid #594029;
    box-shadow:4px 4px 0 #715439;
}

.requirementBox h2{
    margin:0 0 10px;
    font-size:20px;
}

.requirementGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.requirementItem{
    padding:12px 8px;

    background:#e3d1ae;
    border:2px solid #6d5135;

    text-align:center;
}

.requirementNumber{
    margin-top:4px;
    font-size:23px;
    font-weight:bold;
}

.startButton{
    width:100%;
    max-width:1000px;
    margin:14px auto;
    padding:15px;

    display:block;

    border:3px solid #402b19;
    background:#69482c;
    color:#fff0d0;

    font-size:20px;
    cursor:pointer;
}

.startButton:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* 探検中 */

.expeditionPanel{
    width:100%;
    max-width:1000px;
    margin:20px auto;
    padding:17px;

    display:none;

    background:#d0b98f;
    border:3px solid #523923;
    box-shadow:5px 5px 0 #6a4d32;
}

.expeditionPanel.show{
    display:block;
}

.expeditionTitle{
    margin:0;
    font-size:23px;
}

.progressBar{
    width:100%;
    height:23px;
    margin-top:13px;

    overflow:hidden;

    background:#9e835e;
    border:2px solid #4d351f;
}

.progressFill{
    width:0%;
    height:100%;

    background:#6f5433;
    transition:width 1s linear;
}

.countdown{
    margin-top:11px;

    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.claimButton{
    width:100%;
    margin-top:13px;
    padding:13px;

    border:2px solid #3f2a18;
    background:#78502c;
    color:#fff0cf;

    font-size:18px;
    cursor:pointer;
}

.claimButton:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* 報酬表示 */

.rewardResult{
    width:100%;
    max-width:1000px;
    margin:15px auto;
    padding:16px;

    display:none;

    background:#e3d0a9;
    border:3px solid #5f442b;
}

.rewardResult.show{
    display:block;
}

.rewardList{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:8px;
    margin-top:10px;
}

.rewardItem{
    padding:12px;
    text-align:center;

    background:#cdb48a;
    border:2px solid #62472e;
}

.rewardIcon{
    font-size:35px;
}

.rewardName{
    margin-top:4px;
    font-weight:bold;
}

/* メッセージ */

.message{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);

    max-width:90%;
    padding:12px 20px;

    background:#332419;
    color:#fff0d0;
    border:2px solid #d2b77f;

    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:1000;
}

.message.show{
    opacity:1;
}

@media(max-width:600px){

    body{
        padding:9px;
    }

    .topInfo{
        align-items:flex-start;
        flex-direction:column;
    }

    .backButton{
        width:100%;
    }

    .locationCard{
        flex-basis:235px;
    }

    .timeButtons{
        grid-template-columns:repeat(2,1fr);
    }

    .requirementGrid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

/* =====================================================
   時間ごとの設定
===================================================== */

const timeSettings = {

    1:{
        foodMultiplier:1,
        waterMultiplier:1,
        rewardMultiplier:1
    },

    3:{
        foodMultiplier:2,
        waterMultiplier:2,
        rewardMultiplier:2.5
    },

    5:{
        foodMultiplier:3,
        waterMultiplier:3,
        rewardMultiplier:4.2
    },

    12:{
        foodMultiplier:6,
        waterMultiplier:6,
        rewardMultiplier:10
    }

};

/* =====================================================
   基本変数
===================================================== */

let currentUser = null;
let inventoryData = {};
let activeExpedition = null;

let selectedLocationId = locations[0].id;
let selectedHours = 1;

let countdownTimer = null;

/* =====================================================
   ログイン確認
===================================================== */

auth.onAuthStateChanged(user => {

    if(!user){

        alert("先にログインしてください");

        location.href = "../index.html";

        return;
    }

    currentUser = user;

    renderLocations();
    updateRequirementDisplay();

    watchInventory();
    watchExpedition();
});

/* =====================================================
   場所を表示
===================================================== */

function renderLocations(){

    const locationScroll =
        document.getElementById("locationScroll");

    locationScroll.innerHTML = "";

    locations.forEach(location => {

        const card =
            document.createElement("div");

        card.className = "locationCard";

        if(location.id === selectedLocationId){
            card.classList.add("selected");
        }

        card.innerHTML = `
            <div class="locationIcon">
                ${location.icon}
            </div>

            <div class="locationName">
                ${escapeHtml(location.name)}
            </div>

            <div class="locationDescription">
                ${escapeHtml(location.description)}
            </div>

            <div class="difficulty">
                難易度：
                ${"★".repeat(location.difficulty)}
                ${"☆".repeat(6 - location.difficulty)}
            </div>

            <div class="rewardHint">
                報酬倍率：
                ×${location.rewardRate}
            </div>
        `;

        card.addEventListener("click", () => {

            if(activeExpedition){
                showMessage("探検中は場所を変更できません");
                return;
            }

            selectedLocationId = location.id;

            renderLocations();
            updateRequirementDisplay();
        });

        locationScroll.appendChild(card);
    });
}

/* =====================================================
   時間選択
===================================================== */

document
    .querySelectorAll(".timeButton")
    .forEach(button => {

        button.addEventListener("click", () => {

            if(activeExpedition){

                showMessage("探検中は時間を変更できません");
                return;
            }

            document
                .querySelectorAll(".timeButton")
                .forEach(timeButton => {

                    timeButton.classList.remove("active");

                });

            button.classList.add("active");

            selectedHours =
                Number(button.dataset.hours);

            updateRequirementDisplay();
        });
    });

/* =====================================================
   必要物資を計算
===================================================== */

function getRequirements(location,hours){

    const time =
        timeSettings[hours];

    const requiredFood =
        location.foodRate *
        time.foodMultiplier;

    const requiredWater =
        location.waterRate *
        time.waterMultiplier;

    const expectedReward =
        Math.max(
            1,
            Math.round(
                location.rewardRate *
                time.rewardMultiplier
            )
        );

    return {
        requiredFood,
        requiredWater,
        expectedReward
    };
}

function updateRequirementDisplay(){

    const location =
        getSelectedLocation();

    const requirements =
        getRequirements(
            location,
            selectedHours
        );

    document
        .getElementById("selectedTitle")
        .textContent =
            location.name +
            "・" +
            selectedHours +
            "時間";

    document
        .getElementById("requiredFood")
        .textContent =
            requirements.requiredFood;

    document
        .getElementById("requiredWater")
        .textContent =
            requirements.requiredWater;

    document
        .getElementById("expectedReward")
        .textContent =
            "約" +
            requirements.expectedReward +
            "個";
}

/* =====================================================
   インベントリ監視
===================================================== */

function watchInventory(){

    database
        .ref("inventories/" + currentUser.uid)
        .on("value", snapshot => {

            inventoryData =
                snapshot.val() || {};

            updateSupplyDisplay();
        });
}

function updateSupplyDisplay(){

    let foodCount = 0;
    let waterCount = 0;
    let allItemCount = 0;

    Object.values(inventoryData)
    .forEach(item => {

        if(!item){
            return;
        }

        const quantity =
            Number(item.quantity || 0);

        allItemCount += quantity;

        if(item.category === "food"){
            foodCount += quantity;
        }

        if(item.category === "water"){
            waterCount += quantity;
        }
    });

    document
        .getElementById("foodCount")
        .textContent =
            foodCount.toLocaleString();

    document
        .getElementById("waterCount")
        .textContent =
            waterCount.toLocaleString();

    document
        .getElementById("allItemCount")
        .textContent =
            allItemCount.toLocaleString();
}

/* =====================================================
   探検開始
===================================================== */

document
    .getElementById("startButton")
    .addEventListener("click", startExpedition);

async function startExpedition(){

    if(activeExpedition){

        showMessage("すでに探検中です");
        return;
    }

    const location =
        getSelectedLocation();

    const requirements =
        getRequirements(
            location,
            selectedHours
        );

    const foodTotal =
        getCategoryTotal("food");

    const waterTotal =
        getCategoryTotal("water");

    if(foodTotal < requirements.requiredFood){

        showMessage(
            "食べ物が" +
            (requirements.requiredFood - foodTotal) +
            "個足りません"
        );

        return;
    }

    if(waterTotal < requirements.requiredWater){

        showMessage(
            "水が" +
            (requirements.requiredWater - waterTotal) +
            "個足りません"
        );

        return;
    }

    const confirmed = confirm(
        location.name +
        "へ" +
        selectedHours +
        "時間の探検に出ます。\n\n" +
        "食べ物：" +
        requirements.requiredFood +
        "個\n" +
        "水：" +
        requirements.requiredWater +
        "個\n\n" +
        "開始しますか？"
    );

    if(!confirmed){
        return;
    }

    document.getElementById("startButton").disabled = true;

    try{

        const latestSnapshot =
            await database
                .ref(
                    "inventories/" +
                    currentUser.uid
                )
                .once("value");

        const latestInventory =
            latestSnapshot.val() || {};

        if(
            getCategoryTotalFromData(
                latestInventory,
                "food"
            ) < requirements.requiredFood
        ){

            showMessage("食べ物が足りません");
            return;
        }

        if(
            getCategoryTotalFromData(
                latestInventory,
                "water"
            ) < requirements.requiredWater
        ){

            showMessage("水が足りません");
            return;
        }

        const updates = {};

        consumeCategoryItems(
            latestInventory,
            "food",
            requirements.requiredFood,
            updates
        );

        consumeCategoryItems(
            latestInventory,
            "water",
            requirements.requiredWater,
            updates
        );

        const startAt = Date.now();

        const durationMilliseconds =
            getDurationMilliseconds(
                selectedHours
            );

        const endAt =
            startAt + durationMilliseconds;

        const expeditionData = {
            locationId:location.id,
            locationName:location.name,
            locationIcon:location.icon,

            hours:selectedHours,

            requiredFood:
                requirements.requiredFood,

            requiredWater:
                requirements.requiredWater,

            expectedReward:
                requirements.expectedReward,

            startAt:startAt,
            endAt:endAt,

            status:"exploring"
        };

        updates[
            "activeExpeditions/" +
            currentUser.uid
        ] = expeditionData;

        await database.ref().update(updates);

        showMessage("探検を開始しました");

    }catch(error){

        console.error(error);
        showMessage("探検を開始できませんでした");

    }finally{

        document.getElementById("startButton").disabled = false;
    }
}

/* =====================================================
   食料・水を複数のアイテムから減らす
===================================================== */

function consumeCategoryItems(
    inventory,
    category,
    amount,
    updates
){

    let remaining = amount;

    const items =
        Object.entries(inventory)
        .filter(([itemId,item]) => {

            return (
                item &&
                item.category === category &&
                Number(item.quantity || 0) > 0
            );
        });

    for(const [itemId,item] of items){

        if(remaining <= 0){
            break;
        }

        const quantity =
            Number(item.quantity || 0);

        const consumeAmount =
            Math.min(quantity,remaining);

        const newQuantity =
            quantity - consumeAmount;

        const path =
            "inventories/" +
            currentUser.uid +
            "/" +
            itemId;

        if(newQuantity <= 0){

            updates[path] = null;

        }else{

            updates[
                path + "/quantity"
            ] = newQuantity;

            updates[
                path + "/updatedAt"
            ] =
                firebase.database
                    .ServerValue.TIMESTAMP;
        }

        remaining -= consumeAmount;
    }

    if(remaining > 0){
        throw new Error("物資が不足しています");
    }
}

/* =====================================================
   探検状態を監視
===================================================== */

function watchExpedition(){

    database
        .ref(
            "activeExpeditions/" +
            currentUser.uid
        )
        .on("value", snapshot => {

            activeExpedition =
                snapshot.val();

            if(activeExpedition){

                showActiveExpedition();

            }else{

                hideActiveExpedition();
            }
        });
}

function showActiveExpedition(){

    const panel =
        document.getElementById(
            "expeditionPanel"
        );

    panel.classList.add("show");

    document
        .getElementById("expeditionName")
        .textContent =
            activeExpedition.locationIcon +
            " " +
            activeExpedition.locationName;

    document
        .getElementById(
            "expeditionInformation"
        )
        .textContent =
            activeExpedition.hours +
            "時間の探検に出ています。";

    document
        .getElementById("startButton")
        .disabled = true;

    startCountdown();
}

function hideActiveExpedition(){

    document
        .getElementById("expeditionPanel")
        .classList.remove("show");

    document
        .getElementById("startButton")
        .disabled = false;

    if(countdownTimer){
        clearInterval(countdownTimer);
    }
}

/* =====================================================
   残り時間
===================================================== */

function startCountdown(){

    if(countdownTimer){
        clearInterval(countdownTimer);
    }

    updateCountdown();

    countdownTimer =
        setInterval(updateCountdown,1000);
}

function updateCountdown(){

    if(!activeExpedition){
        return;
    }

    const now = Date.now();

    const remaining =
        Number(activeExpedition.endAt) - now;

    const totalDuration =
        Number(activeExpedition.endAt) -
        Number(activeExpedition.startAt);

    const elapsed =
        now -
        Number(activeExpedition.startAt);

    const progress =
        Math.min(
            100,
            Math.max(
                0,
                (elapsed / totalDuration) * 100
            )
        );

    document
        .getElementById("progressFill")
        .style.width =
            progress + "%";

    const claimButton =
        document.getElementById("claimButton");

    if(remaining <= 0){

        document
            .getElementById("countdown")
            .textContent =
                "探検完了";

        claimButton.disabled = false;
        claimButton.textContent =
            "持ち帰った品物を受け取る";

        clearInterval(countdownTimer);

        return;
    }

    document
        .getElementById("countdown")
        .textContent =
            formatTime(remaining);

    claimButton.disabled = true;
    claimButton.textContent =
        "探検中です";
}

function formatTime(milliseconds){

    const totalSeconds =
        Math.ceil(milliseconds / 1000);

    const hours =
        Math.floor(totalSeconds / 3600);

    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );

    const seconds =
        totalSeconds % 60;

    return (
        String(hours).padStart(2,"0") +
        ":" +
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0")
    );
}

/* =====================================================
   報酬受け取り
===================================================== */

document
    .getElementById("claimButton")
    .addEventListener("click", claimRewards);

async function claimRewards(){

    if(!activeExpedition){
        return;
    }

    if(Date.now() < Number(activeExpedition.endAt)){

        showMessage("探検はまだ終わっていません");
        return;
    }

    const claimButton =
        document.getElementById("claimButton");

    claimButton.disabled = true;

    try{

        const expeditionSnapshot =
            await database
                .ref(
                    "activeExpeditions/" +
                    currentUser.uid
                )
                .once("value");

        const latestExpedition =
            expeditionSnapshot.val();

        if(!latestExpedition){

            showMessage("すでに受け取り済みです");
            return;
        }

        if(
            Date.now() <
            Number(latestExpedition.endAt)
        ){

            showMessage("探検はまだ終わっていません");
            return;
        }

        const location =
            locations.find(location =>
                location.id ===
                latestExpedition.locationId
            );

        if(!location){
            throw new Error("場所が見つかりません");
        }

        const rewardCount =
            createRewardCount(
                latestExpedition,
                location
            );

        const rewards =
            generateRewards(
                location,
                rewardCount
            );

        const updates = {};

        for(const reward of rewards){

            const inventoryPath =
                "inventories/" +
                currentUser.uid +
                "/" +
                reward.itemId;

            const currentItem =
                inventoryData[reward.itemId];

            const currentQuantity =
                Number(
                    currentItem?.quantity || 0
                );

            updates[inventoryPath] = {
                name:reward.name,
                category:reward.category,
                icon:reward.icon,
                quantity:
                    currentQuantity +
                    reward.quantity,
                updatedAt:
                    firebase.database
                        .ServerValue.TIMESTAMP
            };
        }

        updates[
            "activeExpeditions/" +
            currentUser.uid
        ] = null;

        await database.ref().update(updates);

        showRewardResult(rewards);

        showMessage(
            "探検の報酬を受け取りました"
        );

    }catch(error){

        console.error(error);
        showMessage("報酬を受け取れませんでした");

    }finally{

        claimButton.disabled = false;
    }
}

/* =====================================================
   報酬数を計算
===================================================== */

function createRewardCount(
    expedition,
    location
){

    const basicCount =
        Number(
            expedition.expectedReward || 1
        );

    /*
    基本獲得数の80%から120%の範囲で変動
    */

    const randomMultiplier =
        0.8 + Math.random() * 0.4;

    return Math.max(
        1,
        Math.round(
            basicCount *
            randomMultiplier
        )
    );
}

/* =====================================================
   報酬抽選
===================================================== */

function generateRewards(
    location,
    rewardCount
){

    const result = {};

    for(let i = 0; i < rewardCount; i++){

        const reward =
            selectWeightedReward(
                location.rewards
            );

        if(!result[reward.itemId]){

            result[reward.itemId] = {
                ...reward,
                quantity:0
            };
        }

        result[reward.itemId].quantity++;
    }

    return Object.values(result);
}

function selectWeightedReward(rewards){

    const totalWeight =
        rewards.reduce(
            (total,reward) =>
                total +
                Number(reward.weight || 0),
            0
        );

    let random =
        Math.random() * totalWeight;

    for(const reward of rewards){

        random -= Number(reward.weight || 0);

        if(random <= 0){
            return reward;
        }
    }

    return rewards[rewards.length - 1];
}

/* =====================================================
   報酬画面
===================================================== */

function showRewardResult(rewards){

    const resultArea =
        document.getElementById(
            "rewardResult"
        );

    const rewardList =
        document.getElementById(
            "rewardList"
        );

    rewardList.innerHTML = "";

    rewards.forEach(reward => {

        const item =
            document.createElement("div");

        item.className = "rewardItem";

        item.innerHTML = `
            <div class="rewardIcon">
                ${reward.icon}
            </div>

            <div class="rewardName">
                ${escapeHtml(reward.name)}
            </div>

            <div>
                ×${reward.quantity}
            </div>
        `;

        rewardList.appendChild(item);
    });

    resultArea.classList.add("show");

    resultArea.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });
}

/* =====================================================
   共通処理
===================================================== */

function getSelectedLocation(){

    return (
        locations.find(
            location =>
                location.id ===
                selectedLocationId
        ) ||
        locations[0]
    );
}

function getCategoryTotal(category){

    return getCategoryTotalFromData(
        inventoryData,
        category
    );
}

function getCategoryTotalFromData(
    inventory,
    category
){

    return Object.values(inventory)
        .filter(item =>
            item &&
            item.category === category
        )
        .reduce(
            (total,item) =>
                total +
                Number(item.quantity || 0),
            0
        );
}

function getDurationMilliseconds(hours){

    if(TEST_MODE){

        /*
        テスト時：
        1時間を1分として扱う
        */

        return hours * 60 * 1000;
    }

    return hours * 60 * 60 * 1000;
}

function showMessage(text){

    const message =
        document.getElementById("message");

    message.textContent = text;
    message.classList.add("show");

    clearTimeout(showMessage.timer);

    showMessage.timer =
        setTimeout(() => {

            message.classList.remove("show");

        },2500);
}

function escapeHtml(value){

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}
