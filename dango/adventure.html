<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>探検</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:14px;
    min-height:100vh;

    font-family:"Yu Mincho","Noto Serif JP",serif;
    color:#302318;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(255,255,255,.10),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(50,30,10,.10),
            transparent 45%
        ),
        #b69a70;
}

button{
    font-family:inherit;
}

/* タイトル */

header{
    width:100%;
    max-width:1000px;
    margin:0 auto 14px;
    padding:16px;

    background:#cbb58e;
    border:3px solid #5c432b;
    box-shadow:4px 4px 0 #725638;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:6px 0 0;
    color:#67513a;
    font-size:14px;
}

/* 上部情報 */

.topInfo{
    width:100%;
    max-width:1000px;
    margin:0 auto 14px;
    padding:10px 12px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;

    background:#d5c29e;
    border:2px solid #60472e;
}

.supplyInfo{
    display:flex;
    flex-wrap:wrap;
    gap:12px;

    font-size:16px;
    font-weight:bold;
}

.backButton{
    padding:8px 12px;

    border:2px solid #4c351f;
    background:#765536;
    color:#f5e7ca;

    cursor:pointer;
}

/* 見出し */

.sectionTitle{
    width:100%;
    max-width:1000px;
    margin:20px auto 9px;

    font-size:21px;
}

/* 横スクロール */

.locationScroll{
    width:100%;
    max-width:1000px;
    margin:0 auto;
    padding:8px 4px 14px;

    display:flex;
    gap:13px;

    overflow-x:auto;
    scroll-snap-type:x mandatory;
}

.locationScroll::-webkit-scrollbar{
    height:10px;
}

.locationScroll::-webkit-scrollbar-thumb{
    background:#755638;
    border-radius:10px;
}

.locationCard{
    flex:0 0 260px;
    min-height:310px;
    padding:14px;

    position:relative;

    background:#d7c4a1;
    border:3px solid #5b422b;
    box-shadow:4px 4px 0 #75593c;

    scroll-snap-align:start;
    cursor:pointer;

    transition:
        transform .15s,
        background .15s;
}

.locationCard:hover{
    transform:translateY(-3px);
}

.locationCard.selected{
    background:#ead5aa;
    border:4px solid #3d2918;
    box-shadow:5px 5px 0 #4f3824;
}

.locationIcon{
    height:100px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#bea479;
    border:2px solid #664a30;

    font-size:58px;
}

.locationName{
    margin-top:12px;
    font-size:21px;
    font-weight:bold;
}

.locationDescription{
    min-height:58px;
    margin-top:6px;

    color:#604c36;
    line-height:1.5;
    font-size:14px;
}

.difficulty{
    margin-top:10px;
    font-weight:bold;
}

.rewardHint{
    margin-top:10px;
    padding-top:8px;

    border-top:1px dashed #806749;
    font-size:13px;
}

/* 時間選択 */

.timeButtons{
    width:100%;
    max-width:1000px;
    margin:0 auto;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.timeButton{
    padding:13px 5px;

    border:2px solid #594026;
    background:#d2bd96;
    color:#382719;

    font-size:17px;
    cursor:pointer;
}

.timeButton.active{
    background:#705036;
    color:#fff0d0;
}

/* 持ち物選択（スロット） */

.itemSelectionBox{
    width:100%;
    max-width:1000px;
    margin:16px auto 0;
    padding:15px;

    background:#cfb991;
    border:3px solid #594029;
    box-shadow:4px 4px 0 #715439;
}

.itemSelectGroup{
    margin-bottom:14px;
}

.itemSelectGroup:last-child{
    margin-bottom:0;
}

.itemSelectHeader{
    margin-bottom:8px;
    font-size:16px;
    font-weight:bold;
}

.slotGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:8px;
}

.slotBox{
    position:relative;
    min-height:74px;
    padding:10px;

    display:flex;
    flex-direction:column;
    justify-content:center;

    background:#e3d1ae;
    border:2px dashed #8a6a42;

    font-size:13px;
    cursor:pointer;
    text-align:center;
}

.slotBox.filled{
    border-style:solid;
    border-color:#6d5135;
    background:#ecdcb8;
    text-align:left;
}

.slotBox.locked{
    opacity:.55;
    cursor:not-allowed;
}

.slotPlaceholder{
    color:#7a6142;
}

.slotItemName{
    font-weight:bold;
}

.slotItemQty{
    margin-top:2px;
    font-size:12px;
    color:#5c4529;
}

.slotEffect{
    margin-top:4px;
    padding:2px 6px;
    align-self:flex-start;

    background:#8a6a42;
    color:#fff3da;
    font-size:11px;
}

.slotClearButton{
    position:absolute;
    top:4px;
    right:4px;

    width:20px;
    height:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#5c3a20;
    color:#fff0d0;
    border:none;

    font-size:13px;
    line-height:1;
    cursor:pointer;
}

/* 持ち物選択モーダル */

.slotModalOverlay{
    position:fixed;
    inset:0;

    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;

    background:rgba(30,20,10,.55);
    z-index:2000;
}

.slotModalOverlay.show{
    display:flex;
}

.slotModalBox{
    width:100%;
    max-width:420px;
    max-height:80vh;

    display:flex;
    flex-direction:column;

    background:#e8d8b6;
    border:3px solid #5c4229;
    box-shadow:5px 5px 0 #4b3520;
}

.slotModalHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;

    background:#cbb58e;
    border-bottom:2px solid #5c4229;

    font-size:17px;
    font-weight:bold;
}

.slotModalClose{
    border:none;
    background:none;

    font-size:20px;
    cursor:pointer;
    color:#3a2914;
}

.slotModalList{
    padding:10px 14px 14px;
    overflow-y:auto;
}

.slotModalOption{
    width:100%;
    padding:10px;
    margin-bottom:6px;

    display:flex;
    align-items:center;
    gap:8px;

    background:#f2e4c4;
    border:2px solid #6d5135;

    font-size:14px;
    text-align:left;
    cursor:pointer;
}

.slotModalOption.clearOption{
    background:#d9c3a0;
    justify-content:center;
    font-weight:bold;
}

.slotModalEmpty{
    margin:0;
    color:#6d5439;
    font-size:13px;
    text-align:center;
}

/* 必要物資 */

.requirementBox{
    width:100%;
    max-width:1000px;
    margin:16px auto 0;
    padding:15px;

    background:#cfb991;
    border:3px solid #594029;
    box-shadow:4px 4px 0 #715439;
}

.requirementBox h2{
    margin:0 0 10px;
    font-size:20px;
}

.requirementGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.requirementItem{
    padding:12px 8px;

    background:#e3d1ae;
    border:2px solid #6d5135;

    text-align:center;
}

.requirementNumber{
    margin-top:4px;
    font-size:23px;
    font-weight:bold;
}

.startButton{
    width:100%;
    max-width:1000px;
    margin:14px auto;
    padding:15px;

    display:block;

    border:3px solid #402b19;
    background:#69482c;
    color:#fff0d0;

    font-size:20px;
    cursor:pointer;
}

.startButton:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* 探検中 */

.expeditionPanel{
    width:100%;
    max-width:1000px;
    margin:20px auto;
    padding:17px;

    display:none;

    background:#d0b98f;
    border:3px solid #523923;
    box-shadow:5px 5px 0 #6a4d32;
}

.expeditionPanel.show{
    display:block;
}

.expeditionTitle{
    margin:0;
    font-size:23px;
}

.progressBar{
    width:100%;
    height:23px;
    margin-top:13px;

    overflow:hidden;

    background:#9e835e;
    border:2px solid #4d351f;
}

.progressFill{
    width:0%;
    height:100%;

    background:#6f5433;
    transition:width 1s linear;
}

.countdown{
    margin-top:11px;

    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.claimButton{
    width:100%;
    margin-top:13px;
    padding:13px;

    border:2px solid #3f2a18;
    background:#78502c;
    color:#fff0cf;

    font-size:18px;
    cursor:pointer;
}

.claimButton:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* 報酬表示 */

.rewardResult{
    width:100%;
    max-width:1000px;
    margin:15px auto;
    padding:16px;

    display:none;

    background:#e3d0a9;
    border:3px solid #5f442b;
}

.rewardResult.show{
    display:block;
}

.rewardList{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:8px;
    margin-top:10px;
}

.rewardItem{
    padding:12px;
    text-align:center;

    background:#cdb48a;
    border:2px solid #62472e;
}

.rewardIcon{
    font-size:35px;
}

.rewardName{
    margin-top:4px;
    font-weight:bold;
}

.failText{
    margin:0;
    color:#6d3223;
    font-weight:bold;
}

/* メッセージ */

.message{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);

    max-width:90%;
    padding:12px 20px;

    background:#332419;
    color:#fff0d0;
    border:2px solid #d2b77f;

    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:1000;
}

.message.show{
    opacity:1;
}
/* 場所カード内・確率を見るボタン */

.rewardTableButton{
    width:100%;
    margin-top:10px;
    padding:9px 5px;

    border:2px solid #594026;
    background:#a9895e;
    color:#fff3da;

    font-size:13px;
    cursor:pointer;
}

.rewardTableButton:hover{
    background:#bb9a6c;
}

/* 確率表モーダル */

.rewardTableOverlay{
    position:fixed;
    inset:0;

    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;

    background:rgba(30,20,10,.55);
    z-index:2000;
}

.rewardTableOverlay.show{
    display:flex;
}

.rewardTablePanel{
    width:100%;
    max-width:420px;
    max-height:80vh;

    display:flex;
    flex-direction:column;

    background:#e8d8b6;
    border:3px solid #5c4229;
    box-shadow:5px 5px 0 #4b3520;
}

.rewardTableHeaderBar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;

    background:#cbb58e;
    border-bottom:2px solid #5c4229;

    font-size:17px;
    font-weight:bold;
}

.rewardTableClose{
    border:none;
    background:none;

    font-size:20px;
    cursor:pointer;
    color:#3a2914;
}

.rewardTableBody{
    padding:12px 14px 14px;
    overflow-y:auto;
}

.rewardTableColumnHeader{
    display:flex;
    justify-content:space-between;

    padding:0 2px 8px;
    margin-bottom:6px;

    border-bottom:2px solid #806749;

    font-size:13px;
    color:#5c4529;
    font-weight:bold;
}

.rewardTableRow{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 4px;

    border-bottom:1px solid #c7ac81;

    font-size:14px;
}

.rewardTableIcon{
    font-size:20px;
}

.rewardTableName{
    flex:1;
}

.rewardTablePercent{
    font-weight:bold;
    color:#5c3a1e;
}
@media(max-width:600px){

    body{
        padding:9px;
    }

    .topInfo{
        align-items:flex-start;
        flex-direction:column;
    }

    .backButton{
        width:100%;
    }

    .locationCard{
        flex-basis:235px;
    }

    .timeButtons{
        grid-template-columns:repeat(2,1fr);
    }

    .requirementGrid{
        grid-template-columns:1fr;
    }

    .slotGrid{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<header>
    <h1>⚔ ダンゴムシ探検隊</h1>
    <p>食料と水を準備し、未知の土地へ遠征する</p>
</header>

<div class="topInfo">

    <div class="supplyInfo">
        <span>
            🍖 食べ物：
            <span id="foodCount">0</span>
        </span>

        <span>
            💧 水：
            <span id="waterCount">0</span>
        </span>

        <span>
            🎒 全所持品：
            <span id="allItemCount">0</span>
        </span>
    </div>

    <button
        class="backButton"
        onclick="location.href='dango.html'"
    >
        村へ戻る
    </button>

</div>

<h2 class="sectionTitle">探検する場所</h2>

<div class="locationScroll" id="locationScroll"></div>

<h2 class="sectionTitle">探検時間</h2>

<div class="timeButtons">

    <button class="timeButton active" data-hours="1">
        1時間
    </button>

    <button class="timeButton" data-hours="3">
        3時間
    </button>

    <button class="timeButton" data-hours="5">
        5時間
    </button>

    <button class="timeButton" data-hours="12">
        12時間
    </button>

</div>

<div class="itemSelectionBox">

    <h2 id="itemSelectionTitle">
        持っていく品を選ぶ（枠をタップして選択・1つだけでも可）
    </h2>

    <div class="itemSelectGroup">
        <div class="itemSelectHeader" id="foodSelectHeader">
            🍖 食べ物（0/3）
        </div>
        <div class="slotGrid" id="foodSlotList"></div>
    </div>

    <div class="itemSelectGroup">
        <div class="itemSelectHeader" id="waterSelectHeader">
            💧 水（0/2）
        </div>
        <div class="slotGrid" id="waterSlotList"></div>
    </div>

    <div class="itemSelectGroup">
        <div class="itemSelectHeader" id="equipmentSelectHeader">
            🎒 装備（0/3）
        </div>
        <div class="slotGrid" id="equipmentSlotList"></div>
    </div>

</div>

<div class="requirementBox">

    <h2 id="selectedTitle">
        探検条件
    </h2>

    <div class="requirementGrid">

    <div class="requirementItem">
        🎯 成功率
        <div class="requirementNumber" id="successRateDisplay">
            0%
        </div>
    </div>

    <div class="requirementItem">
        📦 予想獲得数
        <div class="requirementNumber" id="expectedReward">
            0
        </div>
    </div>

</div>

<button class="startButton" id="startButton">
    探検を開始する
</button>

<section class="expeditionPanel" id="expeditionPanel">

    <h2 class="expeditionTitle" id="expeditionName">
        探検中
    </h2>

    <p id="expeditionInformation"></p>

    <div class="progressBar">
        <div class="progressFill" id="progressFill"></div>
    </div>

    <div class="countdown" id="countdown">
        00:00:00
    </div>

    <button
        class="claimButton"
        id="claimButton"
        disabled
    >
        探検中です
    </button>

</section>

<section class="rewardResult" id="rewardResult">

    <h2>探検の結果</h2>

    <div class="rewardList" id="rewardList"></div>

</section>

<div class="slotModalOverlay" id="slotModalOverlay">
    <div class="slotModalBox">

        <div class="slotModalHeader">
            <span id="slotModalTitle">アイテムを選択</span>
            <button class="slotModalClose" id="slotModalCloseButton">×</button>
        </div>

        <div class="slotModalList" id="slotModalList"></div>

    </div>
</div>
<!-- 確率表 -->

<div class="rewardTableOverlay" id="rewardTableOverlay">

    <div class="rewardTablePanel">

        <h2 class="rewardTableTitle" id="rewardTableTitle">
            取れるもの
        </h2>

        <div class="rewardTableHeader">
            <span>アイテム</span>
            <span>確率</span>
        </div>

        <div id="rewardTableList"></div>

        <button
            class="rewardTableCloseButton"
            id="rewardTableCloseButton"
        >
            閉じる
        </button>

    </div>

</div>
<div class="message" id="message"></div>

<script src="firebase.js"></script>
<script src="common.js"></script>
<script src="items.js"></script>
<script src="itemEffects.js"></script>
<script src="locations.js"></script>
<script src="explore.js"></script>
</body>
</html>
