<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>アゴラ市場</title>


<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px;
    min-height:100vh;

    font-family:"Yu Mincho","Noto Serif JP",serif;
    color:#302318;

    background:
        radial-gradient(circle at 20% 10%,rgba(255,255,255,.10),transparent 35%),
        radial-gradient(circle at 80% 70%,rgba(50,30,10,.10),transparent 45%),
        #b69a70;
}

header{
    width:100%;
    max-width:850px;
    margin:0 auto 14px;
    padding:16px;

    background:#cbb58e;
    border:3px solid #5c432b;
    box-shadow:4px 4px 0 #725638;
}

header h1{
    margin:0;
    font-size:27px;
    letter-spacing:2px;
}

header p{
    margin:5px 0 0;
    color:#665039;
    font-size:14px;
}

.topInfo{
    width:100%;
    max-width:850px;
    margin:0 auto 12px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;

    background:#d5c29e;
    border:2px solid #60472e;
    padding:10px 12px;
}

.point{
    font-weight:bold;
    font-size:18px;
}

.backButton{
    border:2px solid #4c351f;
    background:#765536;
    color:#f5e7ca;
    padding:8px 12px;
    cursor:pointer;
    font-family:inherit;
}

.categoryTabs{
    width:100%;
    max-width:850px;
    margin:0 auto 12px;

    display:flex;
    gap:6px;
}

.categoryTabs button{
    flex:1;
    padding:9px 4px;

    border:2px solid #594026;
    background:#d2bd96;
    color:#382719;

    font-family:inherit;
    font-size:15px;
    cursor:pointer;
}

.categoryTabs button.active{
    background:#705036;
    color:#fff0d0;
}

.controlBox{
    width:100%;
    max-width:850px;
    margin:0 auto 12px;

    display:flex;
    gap:8px;
}

.controlBox input,
.controlBox select{
    width:100%;
    min-width:0;
    padding:10px;

    border:2px solid #62482f;
    background:#eee0c3;

    font-family:inherit;
}

.market{
    width:100%;
    max-width:850px;
    margin:0 auto;
}

.itemCard{
    margin-bottom:10px;
    background:#d7c4a1;
    border:2px solid #5b422b;
    box-shadow:3px 3px 0 #75593c;
}

.itemHeader{
    padding:9px 12px;
    border-bottom:1px solid #8c7252;
    background:#c5ad83;

    font-weight:bold;
    font-size:17px;
}

.offerRow{
    display:grid;
    grid-template-columns:minmax(90px,1.3fr) minmax(65px,.8fr) 65px 74px;
    align-items:center;
    gap:7px;

    padding:10px 12px;
    border-top:1px dashed #9b8260;
}

.offerRow:first-child{
    border-top:none;
}

.seller{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.merchant{
    color:#6d3f15;
    font-weight:bold;
}

.price{
    font-weight:bold;
    text-align:right;
}

.stock{
    text-align:center;
    color:#66513a;
    font-size:13px;
}

.buyButton{
    width:74px;
    height:36px;

    border:2px solid #49311d;
    background:#795536;
    color:#fff0d1;

    font-family:inherit;
    cursor:pointer;
}
.buyButton:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.sellArea{
    width:100%;
    max-width:850px;
    margin:20px auto;

    background:#d7c4a1;
    border:3px solid #5b422b;
    box-shadow:4px 4px 0 #75593c;

    padding:20px;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;
}


.sellArea h2{
    width:100%;
    margin:0;
    padding-bottom:10px;

    text-align:center;
    font-size:21px;

    border-bottom:2px solid #8c7252;
}
.formGrid{
    width:100%;

    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:10px;
}


.formGrid select,
.formGrid input{

    width:100%;
    padding:12px;

    background:#eee0c3;
    border:2px solid #62482f;

    font-family:inherit;
    font-size:15px;
}


.listingSellButton{

    width:80%;
    max-width:400px;
    height:45px;

    border:2px solid #49311d;

    background:#765536;
    color:#fff0d1;

    font-family:inherit;
    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:3px 3px 0 #4a321e;
}


.listingSellButton:hover{
    background:#8a6542;
}


.listingSellButton:active{
    transform:translate(2px,2px);
    box-shadow:none;
}
.myListings{
    width:100%;
    max-width:850px;
    margin:20px auto;
}

.myListings h2{
    font-size:21px;
}

   
.myListing{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:10px;
    align-items:center;

    margin:15px 0 8px;
    padding:10px;

    background:#d4c09b;
    border:2px solid #60462e;
}
.sellArea .sellButton{
    margin-top:8px;
}
.cancelButton{
    padding:7px 9px;

    border:2px solid #593425;
    background:#87523c;
    color:white;

    font-family:inherit;
    cursor:pointer;
}

.empty{
    padding:25px;
    text-align:center;
    background:#d7c4a1;
    border:2px solid #60472e;
}

.message{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);

    max-width:90%;
    padding:12px 20px;

    background:#332419;
    color:#fff0d0;
    border:2px solid #d2b77f;

    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:1000;
}
.buyArea{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:8px;
}

.buyQuantity{
    width:70px;
}


.message.show{
    opacity:1;
}

@media(max-width:600px){
    body{
        padding:10px;
    }

    .offerRow{
        grid-template-columns:minmax(80px,1fr) 65px 58px 65px;
        gap:4px;
        padding:9px 7px;
        font-size:13px;
    }

    .formGrid{
        grid-template-columns:1fr;
    }

    .controlBox{
        flex-direction:column;
    }
}


.sellManagementCard{
    width:100%;
    max-width:850px;
    margin:20px auto;

    background:#d7c4a1;
    border:3px solid #5b422b;
    box-shadow:4px 4px 0 #75593c;
    padding:18px;
}

.sellManagementCard h2{
    margin:0 0 15px;
    padding-bottom:10px;
    border-bottom:2px solid #8c7252;
}

.sellCreate{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:8px;
    align-items:center;
}

.sellCreate select,
.sellCreate input{
    padding:10px;
    background:#eee0c3;
    border:2px solid #62482f;
    font-family:inherit;
}

.sellCreate button{
    grid-column:1 / -1;
    width:180px;
    margin:auto;
}


    .sellCreate{
    width:100%;
    max-width:600px;
    margin:0 auto;

    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:8px;
    align-items:center;
}
</style>

</head>

<body>

<header>
    <h1>🏺 アゴラ市場</h1>
    <p>商人と旅人たちが品物を持ち寄る市場</p>
</header>

<div class="topInfo">
    <div>
        所持ポイント：
        <span class="point" id="pointDisplay">---</span>
    </div>
   

    <button class="backButton" onclick="location.href='dango.html'">
        村へ戻る
    </button>
</div>

<div class="categoryTabs">
    <button class="active" data-category="food">🍖 食べ物</button>
    <button data-category="water">💧 水</button>
    <button data-category="equipment">🛡 装備</button>
</div>

<div class="controlBox">
    <input
        type="search"
        id="searchInput"
        placeholder="商品名を検索"
    >

    <select id="sortSelect">
        <option value="price">値段の安い順</option>
        <option value="new">新しい出品順</option>
    </select>
</div>

<div class="market" id="market">
    <div class="empty">市場を読み込んでいます</div>
</div>
    <div class="market" id="sellMarket" style="display:none;">
    <div class="empty">
        売れる商品を読み込んでいます
    </div>
</div>

<section class="sellArea">
    <h2>自分の持ち物を出品</h2>

    <div class="formGrid">
        <select id="sellItem">
            <option value="">出品する品物を選ぶ</option>
        </select>

        <input
            type="number"
            id="sellQuantity"
            min="1"
            value="1"
            placeholder="個数"
        >

        <input
            type="number"
            id="sellPrice"
            min="1"
            placeholder="1個の値段"
        >
    </div>

   <button class="listingSellButton" id="sellButton">
    市場へ出品する
</button>
</section>

<section class="myListings">
    <h2>自分の出品</h2>
    <div id="myListings">
        <div class="empty">出品はありません</div>
    </div>
</section>

<div class="message" id="message"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script src="firebase.js"></script>

<script src="common.js"></script>
<script src="items.js"></script>
<script src="merchant.js"></script>
<script src="market.js"></script>
<script src="shop.js"></script>
</body>
</html>
