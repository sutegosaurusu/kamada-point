<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>アゴラ市場</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px;
    min-height:100vh;

    font-family:"Yu Mincho","Noto Serif JP",serif;
    color:#302318;

    background:
        radial-gradient(circle at 20% 10%,rgba(255,255,255,.10),transparent 35%),
        radial-gradient(circle at 80% 70%,rgba(50,30,10,.10),transparent 45%),
        #b69a70;
}

header{
    width:100%;
    max-width:850px;
    margin:0 auto 14px;
    padding:16px;

    background:#cbb58e;
    border:3px solid #5c432b;
    box-shadow:4px 4px 0 #725638;
}

header h1{
    margin:0;
    font-size:27px;
    letter-spacing:2px;
}

header p{
    margin:5px 0 0;
    color:#665039;
    font-size:14px;
}

.topInfo{
    width:100%;
    max-width:850px;
    margin:0 auto 12px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;

    background:#d5c29e;
    border:2px solid #60472e;
    padding:10px 12px;
}

.point{
    font-weight:bold;
    font-size:18px;
}

.backButton{
    border:2px solid #4c351f;
    background:#765536;
    color:#f5e7ca;
    padding:8px 12px;
    cursor:pointer;
    font-family:inherit;
}

.categoryTabs{
    width:100%;
    max-width:850px;
    margin:0 auto 12px;

    display:flex;
    gap:6px;
}

.categoryTabs button{
    flex:1;
    padding:9px 4px;

    border:2px solid #594026;
    background:#d2bd96;
    color:#382719;

    font-family:inherit;
    font-size:15px;
    cursor:pointer;
}

.categoryTabs button.active{
    background:#705036;
    color:#fff0d0;
}

.controlBox{
    width:100%;
    max-width:850px;
    margin:0 auto 12px;

    display:flex;
    gap:8px;
}

.controlBox input,
.controlBox select{
    width:100%;
    min-width:0;
    padding:10px;

    border:2px solid #62482f;
    background:#eee0c3;

    font-family:inherit;
}

.market{
    width:100%;
    max-width:850px;
    margin:0 auto;
}

.itemCard{
    margin-bottom:10px;
    background:#d7c4a1;
    border:2px solid #5b422b;
    box-shadow:3px 3px 0 #75593c;
}

.itemHeader{
    padding:9px 12px;
    border-bottom:1px solid #8c7252;
    background:#c5ad83;

    font-weight:bold;
    font-size:17px;
}

.offerRow{
    display:grid;
    grid-template-columns:minmax(90px,1.3fr) minmax(65px,.8fr) 65px 74px;
    align-items:center;
    gap:7px;

    padding:10px 12px;
    border-top:1px dashed #9b8260;
}

.offerRow:first-child{
    border-top:none;
}

.seller{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.merchant{
    color:#6d3f15;
    font-weight:bold;
}

.price{
    font-weight:bold;
    text-align:right;
}

.stock{
    text-align:center;
    color:#66513a;
    font-size:13px;
}

.buyButton{
    padding:8px 6px;

    border:2px solid #49311d;
    background:#795536;
    color:#fff0d1;

    font-family:inherit;
    cursor:pointer;
}

.buyButton:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.sellArea{
    width:100%;
    max-width:850px;
    margin:22px auto;

    background:#cfb991;
    border:3px solid #594029;
    padding:15px;
    box-shadow:4px 4px 0 #715439;
}

.sellArea h2{
    margin:0 0 12px;
    font-size:21px;
}

.formGrid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:8px;
}

.formGrid select,
.formGrid input{
    width:100%;
    padding:10px;

    border:2px solid #62482f;
    background:#eee0c3;

    font-family:inherit;
}

.sellButton{
    width:100%;
    margin-top:10px;
    padding:12px;

    border:2px solid #49311d;
    background:#6e4d30;
    color:#fff0d1;

    font-family:inherit;
    font-size:17px;
    cursor:pointer;
}

.myListings{
    width:100%;
    max-width:850px;
    margin:20px auto;
}

.myListings h2{
    font-size:21px;
}

.myListing{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:10px;
    align-items:center;

    margin-bottom:8px;
    padding:10px;

    background:#d4c09b;
    border:2px solid #60462e;
}

.cancelButton{
    padding:7px 9px;

    border:2px solid #593425;
    background:#87523c;
    color:white;

    font-family:inherit;
    cursor:pointer;
}

.empty{
    padding:25px;
    text-align:center;
    background:#d7c4a1;
    border:2px solid #60472e;
}

.message{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);

    max-width:90%;
    padding:12px 20px;

    background:#332419;
    color:#fff0d0;
    border:2px solid #d2b77f;

    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:1000;
}

.message.show{
    opacity:1;
}

@media(max-width:600px){
    body{
        padding:10px;
    }

    .offerRow{
        grid-template-columns:minmax(80px,1fr) 65px 58px 65px;
        gap:4px;
        padding:9px 7px;
        font-size:13px;
    }

    .formGrid{
        grid-template-columns:1fr;
    }

    .controlBox{
        flex-direction:column;
    }
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="common.js"></script>
</head>

<body>

<header>
    <h1>🏺 アゴラ市場</h1>
    <p>商人と旅人たちが品物を持ち寄る市場</p>
</header>

<div class="topInfo">
    <div>
        所持ポイント：
        <span class="point" id="pointDisplay">---</span>
    </div>

    <button class="backButton" onclick="location.href='dango.html'">
        村へ戻る
    </button>
</div>

<div class="categoryTabs">
    <button class="active" data-category="food">🍖 食べ物</button>
    <button data-category="water">💧 水</button>
    <button data-category="equipment">🛡 装備</button>
</div>

<div class="controlBox">
    <input
        type="search"
        id="searchInput"
        placeholder="商品名を検索"
    >

    <select id="sortSelect">
        <option value="price">値段の安い順</option>
        <option value="new">新しい出品順</option>
    </select>
</div>

<div class="market" id="market">
    <div class="empty">市場を読み込んでいます</div>
</div>

<section class="sellArea">
    <h2>自分の持ち物を出品</h2>

    <div class="formGrid">
        <select id="sellItem">
            <option value="">出品する品物を選ぶ</option>
        </select>

        <input
            type="number"
            id="sellQuantity"
            min="1"
            value="1"
            placeholder="個数"
        >

        <input
            type="number"
            id="sellPrice"
            min="1"
            placeholder="1個の値段"
        >
    </div>

    <button class="sellButton" id="sellButton">
        市場へ出品する
    </button>
</section>

<section class="myListings">
    <h2>自分の出品</h2>
    <div id="myListings">
        <div class="empty">出品はありません</div>
    </div>
</section>

<div class="message" id="message"></div>

<script>
/* =====================================================
   Firebase設定
   自分のFirebase設定に書き換えてください
===================================================== */


/* =====================================================
   基本データ
===================================================== */

let currentUser = null;
let currentMember = null;

/*
商人の商品です。

stockは無限なので設定不要です。
商人の商品を増やす場合は、この中に追加してください。
*/



/* =====================================================
   ログイン確認
===================================================== */

auth.onAuthStateChanged(async user => {

    if(!user){
        alert("先にログインしてください");
        location.href = "../index.html";
        return;
    }

    currentUser = user;

    const memberSnapshot = await database
        .ref("members/" + user.uid)
        .once("value");

    currentMember = memberSnapshot.val();

    if(!currentMember){
        showMessage("会員情報が見つかりません");
        return;
    }

    updatePointDisplay();

    watchMember();
    watchInventory();
    watchListings();
});

/* =====================================================
   会員情報を監視
===================================================== */

function watchMember(){

    database
        .ref("members/" + currentUser.uid)
        .on("value", snapshot => {

            currentMember = snapshot.val() || {};
            updatePointDisplay();
        });
}

function updatePointDisplay(){

    const point = Number(currentMember?.point || 0);

    document.getElementById("pointDisplay").textContent =
        point.toLocaleString() + " Pt";
}

/* =====================================================
   持ち物を監視
===================================================== */

function watchInventory(){

    database
        .ref("inventories/" + currentUser.uid)
        .on("value", snapshot => {

            inventoryData = snapshot.val() || {};

            renderSellItems();
            renderMarket();
        });
}




/* =====================================================
   カテゴリ切り替え
===================================================== */




/* =====================================================
   商人から購入
===================================================== */

async function buyMerchantItem(item){

    const confirmed = confirm(
        item.itemName +
        "を" +
        Number(item.price).toLocaleString() +
        "Ptで購入しますか？"
    );

    if(!confirmed){
        return;
    }

    try{

        const pointRef =
            database.ref(
                "members/" +
                currentUser.uid +
                "/point"
            );

        const pointResult =
            await pointRef.transaction(currentPoint => {

                const point = Number(currentPoint || 0);

                if(point < item.price){
                    return;
                }

                return point - item.price;
            });

        if(!pointResult.committed){

            showMessage("ポイントが足りません");
            return;
        }

        await addItemToInventory(
            currentUser.uid,
            item.itemId,
            item.itemName,
            item.category,
            1
        );

        showMessage(item.itemName + "を購入しました");

    }catch(error){

        console.error(error);
        showMessage("購入に失敗しました");
    }
}

/* =====================================================
   会員の出品を購入
===================================================== */

async function buyMemberListing(listing){

    if(listing.sellerId === currentUser.uid){

        showMessage("自分の出品は購入できません");
        return;
    }

    const confirmed = confirm(
        listing.itemName +
        "を" +
        Number(listing.price).toLocaleString() +
        "Ptで購入しますか？"
    );

    if(!confirmed){
        return;
    }

    const buyerPointRef =
        database.ref(
            "members/" +
            currentUser.uid +
            "/point"
        );

    let pointDeducted = false;

    try{

        /*
        購入者からポイントを引く
        */

        const pointResult =
            await buyerPointRef.transaction(currentPoint => {

                const point = Number(currentPoint || 0);

                if(point < listing.price){
                    return;
                }

                return point - Number(listing.price);
            });

        if(!pointResult.committed){

            showMessage("ポイントが足りません");
            return;
        }

        pointDeducted = true;

        /*
        在庫を1個減らす
        */

        const listingRef =
            database.ref(
                "marketListings/" + listing.id
            );

        const listingResult =
            await listingRef.transaction(currentListing => {

                if(!currentListing){
                    return;
                }

                const quantity =
                    Number(currentListing.quantity || 0);

                if(quantity <= 0){
                    return;
                }

                if(quantity === 1){
                    return null;
                }

                currentListing.quantity = quantity - 1;

                return currentListing;
            });

        if(!listingResult.committed){

            await refundPoints(listing.price);

            showMessage("この商品は売り切れました");
            return;
        }

        /*
        出品者にポイントを渡す
        */

        await database
            .ref(
                "members/" +
                listing.sellerId +
                "/point"
            )
            .transaction(currentPoint =>
                Number(currentPoint || 0) +
                Number(listing.price)
            );

        /*
        購入者の持ち物へ追加
        */

        await addItemToInventory(
            currentUser.uid,
            listing.itemId,
            listing.itemName,
            listing.category,
            1
        );

        showMessage(listing.itemName + "を購入しました");

    }catch(error){

        console.error(error);

        if(pointDeducted){
            await refundPoints(listing.price);
        }

        showMessage("購入処理に失敗しました");
    }
}

async function refundPoints(amount){

    await database
        .ref(
            "members/" +
            currentUser.uid +
            "/point"
        )
        .transaction(currentPoint =>
            Number(currentPoint || 0) +
            Number(amount)
        );
}

/* =====================================================
   持ち物へ追加
===================================================== */

async function addItemToInventory(
    uid,
    itemId,
    itemName,
    category,
    quantity
){

    const itemRef =
        database.ref(
            "inventories/" +
            uid +
            "/" +
            itemId
        );

    await itemRef.transaction(currentItem => {

        if(!currentItem){

            return {
                name:itemName,
                category:category,
                quantity:Number(quantity),
                updatedAt:firebase.database.ServerValue.TIMESTAMP
            };
        }

        currentItem.quantity =
            Number(currentItem.quantity || 0) +
            Number(quantity);

        currentItem.name = itemName;
        currentItem.category = category;
        currentItem.updatedAt =
            firebase.database.ServerValue.TIMESTAMP;

        return currentItem;
    });
}

/* =====================================================
   出品できる持ち物を表示
===================================================== */

function renderSellItems(){

    const select =
        document.getElementById("sellItem");

    select.innerHTML =
        '<option value="">出品する品物を選ぶ</option>';

    Object.entries(inventoryData)
    .forEach(([itemId, item]) => {

        if(!item){
            return;
        }

        const quantity =
            Number(item.quantity || 0);

        if(quantity <= 0){
            return;
        }

        if(item.category !== currentCategory){
            return;
        }

        const option =
            document.createElement("option");

        option.value = itemId;

        option.textContent =
            item.name +
            "　所持数：" +
            quantity;

        select.appendChild(option);
    });
}

/* =====================================================
   出品
===================================================== */

document
    .getElementById("sellButton")
    .addEventListener("click", sellItem);

async function sellItem(){

    const itemId =
        document.getElementById("sellItem").value;

    const quantity =
        Number(
            document.getElementById("sellQuantity").value
        );

    const price =
        Number(
            document.getElementById("sellPrice").value
        );

    if(!itemId){

        showMessage("出品する品物を選んでください");
        return;
    }

    if(!Number.isInteger(quantity) || quantity <= 0){

        showMessage("個数を正しく入力してください");
        return;
    }

    if(!Number.isInteger(price) || price <= 0){

        showMessage("値段を正しく入力してください");
        return;
    }

    const item = inventoryData[itemId];

    if(!item){

        showMessage("その品物を持っていません");
        return;
    }

    const inventoryRef =
        database.ref(
            "inventories/" +
            currentUser.uid +
            "/" +
            itemId
        );

    try{

        /*
        所持品から出品分を減らす
        */

        const inventoryResult =
            await inventoryRef.transaction(currentItem => {

                if(!currentItem){
                    return;
                }

                const ownedQuantity =
                    Number(currentItem.quantity || 0);

                if(ownedQuantity < quantity){
                    return;
                }

                if(ownedQuantity === quantity){
                    return null;
                }

                currentItem.quantity =
                    ownedQuantity - quantity;

                return currentItem;
            });

        if(!inventoryResult.committed){

            showMessage("持っている個数が足りません");
            return;
        }

        /*
        市場へ登録
        */

        const newListingRef =
            database.ref("marketListings").push();

        await newListingRef.set({
            sellerId:currentUser.uid,
            sellerName:
                currentMember.name ||
                currentUser.displayName ||
                "会員",

            itemId:itemId,
            itemName:item.name,
            category:item.category,

            price:price,
            quantity:quantity,

            createdAt:
                firebase.database.ServerValue.TIMESTAMP
        });

        document.getElementById("sellQuantity").value = 1;
        document.getElementById("sellPrice").value = "";

        showMessage(item.name + "を出品しました");

    }catch(error){

        console.error(error);

        /*
        出品に失敗した場合は持ち物を戻す
        */

        await addItemToInventory(
            currentUser.uid,
            itemId,
            item.name,
            item.category,
            quantity
        );

        showMessage("出品に失敗しました");
    }
}

/* =====================================================
   自分の出品表示
===================================================== */

function renderMyListings(){

    const area =
        document.getElementById("myListings");

    if(!currentUser){
        return;
    }

    const ownListings =
        Object.entries(listingData)
        .filter(([id, listing]) =>
            listing &&
            listing.sellerId === currentUser.uid
        );

    if(ownListings.length === 0){

        area.innerHTML =
            '<div class="empty">出品はありません</div>';

        return;
    }

    area.innerHTML = "";

    ownListings.forEach(([listingId, listing]) => {

        const row =
            document.createElement("div");

        row.className = "myListing";

        row.innerHTML = `
            <div>
                <strong>${escapeHtml(listing.itemName)}</strong>
                <br>
                ${Number(listing.price).toLocaleString()}Pt ×
                ${Number(listing.quantity || 0)}個
            </div>

            <div>
                合計
                ${(
                    Number(listing.price) *
                    Number(listing.quantity || 0)
                ).toLocaleString()}Pt
            </div>

            <button class="cancelButton">
                取り下げ
            </button>
        `;

        row
            .querySelector(".cancelButton")
            .addEventListener("click", () => {

                cancelListing(listingId, listing);
            });

        area.appendChild(row);
    });
}

/* =====================================================
   出品取り下げ
===================================================== */

async function cancelListing(listingId, listing){

    const confirmed =
        confirm(
            listing.itemName +
            "の出品を取り下げますか？"
        );

    if(!confirmed){
        return;
    }

    try{

        const snapshot =
            await database
                .ref(
                    "marketListings/" +
                    listingId
                )
                .once("value");

        const latestListing =
            snapshot.val();

        if(!latestListing){

            showMessage("すでに売り切れています");
            return;
        }

        if(latestListing.sellerId !== currentUser.uid){

            showMessage("この出品は取り下げられません");
            return;
        }

        await addItemToInventory(
            currentUser.uid,
            latestListing.itemId,
            latestListing.itemName,
            latestListing.category,
            Number(latestListing.quantity || 0)
        );

        await database
            .ref(
                "marketListings/" +
                listingId
            )
            .remove();

        showMessage("出品を取り下げました");

    }catch(error){

        console.error(error);
        showMessage("取り下げに失敗しました");
    }
}

/* =====================================================
   共通処理
===================================================== */

function showMessage(text){

    const message =
        document.getElementById("message");

    message.textContent = text;
    message.classList.add("show");

    clearTimeout(showMessage.timer);

    showMessage.timer = setTimeout(() => {
        message.classList.remove("show");
    },2500);
}

function escapeHtml(value){

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}
</script>
