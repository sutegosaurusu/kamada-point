<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ダンゴムシダンジョン</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Yu Mincho","Noto Serif JP",serif;
    background:#b79d74;
    background-image:
        radial-gradient(circle at 20% 20%,rgba(255,255,255,.08),transparent 40%),
        radial-gradient(circle at 80% 60%,rgba(0,0,0,.08),transparent 50%);
    color:#2d2116;
    min-height:100vh;
}

/* タイトル */

header{
    background:#cbb38a;
    border-bottom:6px solid #5b442b;
    padding:22px;
    text-align:center;
    box-shadow:0 4px 8px rgba(0,0,0,.25);
}

header h1{
    font-size:36px;
    letter-spacing:2px;
    color:#3b2b1b;
}

header p{
    margin-top:8px;
    color:#6b5538;
    font-style:italic;
}

/* 共通カード */

.card{
    width:90%;
    max-width:650px;
    margin:24px auto;
    background:#d9ccb2;
    border:3px solid #5b442b;
    border-radius:6px;
    padding:18px;
    box-shadow:4px 4px 0 #7d6443;
}

/* ポイント */

.pointTitle{
    text-align:center;
    font-size:20px;
}

.point{
    margin-top:12px;
    text-align:center;
    font-size:42px;
    font-weight:bold;
    color:#715317;
}

/* ボタン */

.menu{
    width:90%;
    max-width:650px;
    margin:30px auto;
}

.menu button{
    width:100%;
    padding:18px;
    margin-bottom:16px;

    background:#8a6842;
    color:#f5ebd5;

    border:3px solid #4d351f;
    border-radius:6px;

    font-size:22px;
    font-family:inherit;

    cursor:pointer;
    transition:.15s;

    box-shadow:3px 3px 0 #3d2917;
}

.menu button:hover{
    background:#7a5937;
}

.menu button:active{
    transform:translateY(3px);
    box-shadow:none;
}
    .backArea{
    text-align:center;
    margin:30px 0;
}

/* 現在地 */

.location{
    width:90%;
    max-width:650px;
    margin:25px auto;

    background:#cab58d;

    border:3px solid #5b442b;

    padding:15px;

    text-align:center;

    font-size:18px;
}

/* フッター */

footer{
    margin:40px 0 20px;
    text-align:center;
    color:#5e4932;
    font-size:14px;
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="firebase.js"></script>
<script src="common.js"></script>
</head>
<body>

<header>
    <h1>🏛 ダンゴムシダンジョン</h1>
    <p>現在地: アグロポリス</p>
</header>

<div class="menu">

    <div class="point" id="pointDisplay">0 Pt</div>

   <button onclick="location.href='adventure.html'">
    ⚔ 探検へ
</button>
　　<button onclick="location.href='farm.html'">
    🌾 農園
</button>
    <button onclick="location.href='jobs.html'">
    👦 求人
</button>
<button onclick="location.href='inventory.html'">
    🎒 持ち物
</button>

<button onclick="location.href='shop.html'">
    🏺 店
</button>
<button onclick="location.href='craft.html'">
    🛠 工房へ
</button>
<button onclick="location.href='map.html'">
    🗺 マップ
</button>
    <button class="backButton" onclick="location.href='../user.html'">
        ← 戻る
    </button>
</div>
   
</div>

<footer>
    ダンゴムシ遠征隊
</footer>

</body>
</html>
