<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>持ち物</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px;
    min-height:100vh;

    font-family:"Yu Mincho","Noto Serif JP",serif;
    color:#302318;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(255,255,255,.10),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(50,30,10,.10),
            transparent 45%
        ),
        #b69a70;
}

/* タイトル */

header{
    width:100%;
    max-width:900px;
    margin:0 auto 14px;
    padding:16px;

    background:#cbb58e;
    border:3px solid #5c432b;
    box-shadow:4px 4px 0 #725638;
}

header h1{
    margin:0;
    font-size:28px;
    letter-spacing:2px;
}

header p{
    margin:6px 0 0;
    color:#665039;
    font-size:14px;
}

/* 上部メニュー */

.topInfo{
    width:100%;
    max-width:900px;
    margin:0 auto 12px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;

    background:#d5c29e;
    border:2px solid #60472e;
    padding:10px 12px;
}

.itemCount{
    font-size:17px;
    font-weight:bold;
}

.topButtons{
    display:flex;
    gap:7px;
}

.smallButton{
    padding:8px 11px;

    border:2px solid #4c351f;
    background:#765536;
    color:#f5e7ca;

    font-family:inherit;
    cursor:pointer;
}

/* カテゴリ */

.categoryTabs{
    width:100%;
    max-width:900px;
    margin:0 auto 14px;

    display:flex;
    gap:6px;
}

.categoryTabs button{
    flex:1;
    padding:10px 4px;

    border:2px solid #594026;
    background:#d2bd96;
    color:#382719;

    font-family:inherit;
    font-size:15px;
    cursor:pointer;
}

.categoryTabs button.active{
    background:#705036;
    color:#fff0d0;
}

/* 持ち物一覧 */

.inventory{
    width:100%;
    max-width:900px;
    margin:0 auto;

    display:grid;
    grid-template-columns:repeat(
        auto-fill,
        minmax(230px,1fr)
    );
    gap:14px;
}

/* アイテムカード */

.itemCard{
    position:relative;
    min-height:190px;
    padding:15px;

    background:#d7c4a1;
    border:3px solid #5b422b;
    box-shadow:4px 4px 0 #75593c;

    cursor:pointer;
    transition:
        transform .15s,
        background .15s;
}

.itemCard:hover{
    transform:translateY(-3px);
    background:#dfcdab;
}

.itemCard:active{
    transform:translateY(2px);
    box-shadow:2px 2px 0 #75593c;
}

/* 絵文字 */

.itemIcon{
    width:75px;
    height:75px;
    margin:0 auto 10px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#c6ad83;
    border:2px solid #684c31;
    border-radius:50%;

    font-size:43px;
}

/* 名前 */

.itemName{
    text-align:center;
    font-size:21px;
    font-weight:bold;
    word-break:break-word;
}

/* 分類 */

.itemCategory{
    margin-top:5px;
    text-align:center;
    color:#70583d;
    font-size:13px;
}

/* 個数 */

.quantity{
    position:absolute;
    top:9px;
    right:9px;

    min-width:48px;
    padding:5px 8px;

    background:#523920;
    color:#fff0d0;
    border:2px solid #dbc08c;

    text-align:center;
    font-size:17px;
    font-weight:bold;
}

/* 下の案内 */

.tapText{
    margin-top:14px;
    text-align:center;
    color:#715b41;
    font-size:13px;
}

/* 空の場合 */

.empty{
    grid-column:1 / -1;

    padding:35px 15px;
    text-align:center;

    background:#d7c4a1;
    border:3px solid #60472e;
}

/* 詳細画面の背景 */

.detailOverlay{
    position:fixed;
    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    padding:18px;

    background:rgba(35,23,13,.72);
    z-index:1000;
}

.detailOverlay.show{
    display:flex;
}

/* 詳細パネル */

.detailPanel{
    width:100%;
    max-width:480px;
    max-height:90vh;
    overflow-y:auto;

    padding:20px;

    background:#d8c49f;
    border:4px solid #4f3722;
    box-shadow:7px 7px 0 rgba(25,15,8,.55);
}

.detailIcon{
    width:100px;
    height:100px;
    margin:0 auto 12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#bea276;
    border:3px solid #63472c;
    border-radius:50%;

    font-size:58px;
}

.detailName{
    margin:0;
    text-align:center;
    font-size:27px;
}

.detailCategory{
    margin-top:5px;
    text-align:center;
    color:#695139;
}

.detailQuantity{
    margin:15px 0;
    padding:10px;

    background:#c7ae83;
    border:2px solid #63472c;

    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.effectTitle{
    margin:15px 0 7px;
    padding-bottom:5px;

    border-bottom:2px solid #795b3b;
    font-size:18px;
}

.effectText{
    min-height:70px;
    padding:12px;

    background:#eadbbd;
    border:2px solid #73563a;

    line-height:1.8;
    white-space:pre-wrap;
}

.closeButton{
    width:100%;
    margin-top:15px;
    padding:12px;

    border:2px solid #49311d;
    background:#6e4d30;
    color:#fff0d1;

    font-family:inherit;
    font-size:17px;
    cursor:pointer;
}

/* スマホ */

@media(max-width:600px){

    body{
        padding:10px;
    }

    header h1{
        font-size:24px;
    }

    .topInfo{
        align-items:flex-start;
        flex-direction:column;
    }

    .topButtons{
        width:100%;
    }

    .smallButton{
        flex:1;
    }

    .categoryTabs button{
        font-size:14px;
        padding:9px 2px;
    }

    .inventory{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:9px;
    }

    .itemCard{
        min-height:175px;
        padding:12px 7px;
    }

    .itemIcon{
        width:67px;
        height:67px;
        font-size:38px;
    }

    .itemName{
        font-size:17px;
    }

    .quantity{
        min-width:41px;
        font-size:14px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎒 旅人の持ち物</h1>
    <p>探検で使う食料、水、道具を保管する場所</p>
</header>

<div class="topInfo">

    <div class="itemCount">
        所持品：
        <span id="totalItemCount">0</span>個
    </div>

    <div class="topButtons">

        <button
            class="smallButton"
            onclick="location.href='shop.html'"
        >
            🏺 店
        </button>

        <button
            class="smallButton"
            onclick="location.href='dango.html'"
        >
            村へ戻る
        </button>

    </div>

</div>

<div class="categoryTabs">

    <button
        class="active"
        data-category="food"
    >
        🍖 食べ物
    </button>

    <button data-category="water">
        💧 水
    </button>

    <button data-category="equipment">
        🛡 装備
    </button>

    <button data-category="material">
    🪨 素材
</button>
</div>

<div class="inventory" id="inventory">

    <div class="empty">
        持ち物を読み込んでいます
    </div>

</div>

<!-- アイテム詳細 -->

<div class="detailOverlay" id="detailOverlay">

    <div class="detailPanel">

        <div class="detailIcon" id="detailIcon">
            📦
        </div>

        <h2 class="detailName" id="detailName">
            アイテム
        </h2>

        <div
            class="detailCategory"
            id="detailCategory"
        >
            分類
        </div>

        <div
            class="detailQuantity"
            id="detailQuantity"
        >
            所持数：0個
        </div>

        <div class="effectTitle">
            アイテムの効果
        </div>

        <div class="effectText" id="detailEffect">
            効果はありません。
        </div>

        <button
            class="closeButton"
            id="closeDetailButton"
        >
            閉じる
        </button>

    </div>

</div>


<script src="firebase.js"></script>
<script src="common.js"></script>
<script src="items.js"></script>
<script src="inventory.js"></script>
</body>
</html>
