<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>工房</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px;
    min-height:100vh;

    font-family:"Yu Mincho","Noto Serif JP",serif;
    color:#302318;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(255,255,255,.10),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(50,30,10,.10),
            transparent 45%
        ),
        #b69a70;
}

.panel{
    width:100%;
    max-width:520px;
    margin:0 auto;
}

/* タイトル */

header{
    padding:16px;

    background:#cbb58e;
    border:3px solid #5c432b;
    box-shadow:4px 4px 0 #725638;
}

header h1{
    margin:0;
    font-size:26px;
    letter-spacing:1px;
}

header p{
    margin:6px 0 0;
    color:#665039;
    font-size:14px;
}

.backButtons{
    display:flex;
    gap:7px;
}

.backButton{
    padding:8px 11px;

    border:2px solid #4c351f;
    background:#765536;
    color:#f5e7ca;

    font-family:inherit;
    font-size:13px;
    cursor:pointer;
}

/* 作れる装備数 */

.countBar{
    margin-top:14px;
    padding:10px 14px;

    background:#e3d1ae;
    border:2px solid #6d5135;

    font-size:16px;
    font-weight:bold;
}

/* 見出し */

.sectionTitle{
    margin:18px 0 8px;
    font-size:17px;
    font-weight:bold;
}

/* レシピカード */

.recipeList{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.recipeHeader{
    display:flex;
    align-items:center;
    gap:10px;
}

.recipeIcon{
    width:44px;
    height:44px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#c6ad83;
    border:2px solid #684c31;
    border-radius:50%;

    font-size:24px;
}

.recipeName{
    font-size:18px;
    font-weight:bold;
}

.recipeEffect{
    margin-top:2px;
    color:#4d6430;
    font-size:13px;
    font-weight:bold;
}

.materialCosts{
    margin-top:10px;

    display:flex;
    flex-wrap:wrap;
    gap:10px;

    font-size:15px;
}

.ownedRow{
    margin-top:6px;

    display:flex;
    flex-wrap:wrap;
    gap:10px;

    font-size:13px;
    color:#5c4529;
}

.ownedRow span.short{
    color:#7a2a1c;
    font-weight:bold;
}

.pointRow{
    margin-top:8px;
    font-size:13px;
    font-weight:bold;
}

.pointRow.short{
    color:#7a2a1c;
}

.pointRow.ticketRow{
    color:#4d6430;
    background:#e7f0d2;
    border:1px solid #6d8a3a;
    padding:6px 8px;
}

.craftButton{
    width:100%;
    margin-top:12px;
    padding:11px;

    border:2px solid #402b19;
    background:#69482c;
    color:#fff0d0;

    font-family:inherit;
    font-size:15px;
    cursor:pointer;
}

.craftButton:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.empty{
    padding:30px 15px;
    text-align:center;

    background:#d7c4a1;
    border:3px solid #60472e;
}

/* 所持素材 */

.materialSummary{
    margin-top:8px;
    padding:12px 14px;

    display:flex;
    flex-wrap:wrap;
    gap:14px;

    background:#e3d1ae;
    border:2px solid #6d5135;

    font-size:16px;
}

/* レシピ図鑑 */

.recipeIndex{
    margin-top:8px;
    padding:12px 14px;

    display:flex;
    flex-wrap:wrap;
    gap:12px;

    background:#e3d1ae;
    border:2px solid #6d5135;

    font-size:15px;
}

.recipeIndex .known{
    color:#3a5a20;
    font-weight:bold;
}

.recipeIndex .unknown{
    color:#8a7457;
}

/* メッセージ */

.message{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);

    max-width:90%;
    padding:12px 20px;

    background:#332419;
    color:#fff0d0;
    border:2px solid #d2b77f;

    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:1000;
}

.message.show{
    opacity:1;
}
</style>
<link rel="stylesheet" href="card.css">
</head>

<body>

<div class="panel">

    <header>
        <h1>🏛 ダンゴムシ工房</h1>
        <p>素材から装備を作ろう</p>
    </header>

    <div class="itemCard pointCard">

        <div class="itemHeader">
            所持ポイント
        </div>

        <div class="offerRow">

            <span class="point" id="pointDisplay">
                0 Pt
            </span>

        <div class="backButtons">

            <button
                class="backButton"
                onclick="location.href='inventory.html'"
            >
                🎒 持ち物
            </button>

            <button
                class="backButton"
                onclick="location.href='dango.html'"
            >
                村へ戻る
            </button>

        </div>

        </div>

    </div>

    <div class="countBar" id="countBar">
        ⭐ 作れる装備 0種類
    </div>

    <div class="recipeList" id="recipeList">

        <div class="empty">
            レシピを読み込んでいます
        </div>

    </div>

    <div class="sectionTitle">📦 所持素材</div>
    <div class="materialSummary" id="materialSummary"></div>

    <div class="sectionTitle">📖 レシピ図鑑</div>
    <div class="recipeIndex" id="recipeIndex"></div>

</div>

<div class="message" id="message"></div>

<script src="firebase.js"></script>
<script src="common.js"></script>
<script src="items.js"></script>
<script src="itemEffects.js"></script>
<script src="recipes.js"></script>
<script src="craft.js"></script>
</body>
</html>
