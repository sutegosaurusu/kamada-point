<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者ページ</title>
</head>
  <style>
#toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:white;
  padding:12px 24px;
  border-radius:8px;
  display:none;
  font-size:18px;
  z-index:9999;
}
</style>

<body>
<div id="toast"></div>
  
  
<h1>管理者ページ</h1>

<button id="logoutBtn">ログアウト</button>

<hr>

<h2>ユーザー選択</h2>
<select id="userSelect"></select>

<hr>

<h2>ポイント操作</h2>

<input id="addPoint" type="number" placeholder="＋ポイント">
<button id="addButton">追加</button>

<br><br>

<input id="minusPoint" type="number" placeholder="－ポイント">
<button id="minusButton">減少</button>

<hr>

<h2>BAN操作</h2>
<button id="banButton">BAN</button>
<button id="unbanButton">BAN解除</button>

<hr>

<h2>ランキング</h2>
<button id="rankButton">ランキング表示</button>
<div id="rankList"></div>

<hr>
<h2>履歴</h2>
<button id="logButton">履歴表示</button>
<div id="logList"></div>
  <hr>

<h2>ルール編集</h2>

<textarea
id="ruleText"
rows="15"
cols="60">
</textarea>

<br><br>

<button id="saveRule">
ルール保存
</button>
   <button onclick="location.href='rules.html'">
ルールを見る
</button>

<script type="module">
 

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getDatabase,
  ref,
  onValue,
  get,
  update,
  push,
  set
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBgILQJKJOiQ6gIeZPKhbVjdybXS_vsD3Q",
  authDomain: "kamadapoint.firebaseapp.com",
  databaseURL: "https://kamadapoint-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kamadapoint",
  storageBucket: "kamadapoint.firebasestorage.app",
  messagingSenderId: "601769416524",
  appId: "1:601769416524:web:0be49ce5a0baf87f75e1e9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;

/* ---------------- 認証・管理者チェック ---------------- */
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    location.href = "login.html";
    return;
  }

  currentUser = user;

  // 自分の情報を取得
  const snap = await get(ref(db, "members/" + user.uid));

  if (!snap.exists()) {
    await signOut(auth);
    location.href = "login.html";
    return;
  }

  const data = snap.val();

  // BANされていたらログアウト
  if (data.banned === true) {
    alert("BANされています");
    await signOut(auth);
    location.href = "login.html";
    return;
  }

  // 管理者以外はログイン画面へ
  if (data.admin !== true) {
    alert("管理者ではありません");
    await signOut(auth);
    location.href = "login.html";
    return;
  }

});

/* ---------------- ログアウト ---------------- */
document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
  location.href = "login.html";
};

/* ---------------- ユーザー一覧 ---------------- */
onValue(ref(db, "members"), snap => {

  const data = snap.val() || {};
  const select = document.getElementById("userSelect");

  select.innerHTML = "";

  for (const uid in data) {
    const opt = document.createElement("option");
    opt.value = uid;
    opt.textContent = data[uid].name;
    select.appendChild(opt);
  }
});

/* ---------------- ポイント追加 ---------------- */
document.getElementById("addButton").onclick = async () => {

  const uid = document.getElementById("userSelect").value;
  const val = Number(document.getElementById("addPoint").value);

  if (!uid || val <= 0) return;

  const r = ref(db, "members/" + uid);
  const s = await get(r);

  const current = s.val()?.point || 0;

  await update(r, {
    point: current + val
  });

 await push(ref(db, "logs/" + uid), {
    action: "+" + val,
    by: currentUser.uid,
    time: Date.now()
  });
  showToast(val + "ポイント追加しました");
};

/* ---------------- ポイント減少 ---------------- */
document.getElementById("minusButton").onclick = async () => {

  const uid = document.getElementById("userSelect").value;
  const val = Number(document.getElementById("minusPoint").value);

  if (!uid || val <= 0) return;

  const r = ref(db, "members/" + uid);
  const s = await get(r);

  const current = s.val()?.point || 0;

  await update(r, {
    point: current - val
  });

 await push(ref(db, "logs/" + uid), {
    action: "-" + val,
    by: currentUser.uid,
    time: Date.now()
  });
  showToast(val + "ポイント減少しました");
};

/* ---------------- BAN ---------------- */
document.getElementById("banButton").onclick = async () => {

  const uid = document.getElementById("userSelect").value;
  if (!uid) return;

  await update(ref(db, "members/" + uid), {
    banned: true
  });

  alert("BANしました");
};

/* ---------------- BAN解除 ---------------- */
document.getElementById("unbanButton").onclick = async () => {

  const uid = document.getElementById("userSelect").value;
  if (!uid) return;

  await update(ref(db, "members/" + uid), {
    banned: false
  });

  alert("BAN解除しました");
};
/* ---------------- ランキング ---------------- */
document.getElementById("rankButton").onclick = () => {

  const box = document.getElementById("rankList");

  onValue(ref(db, "members"), snap => {

    const data = snap.val() || {};

    box.innerHTML = "";

    const arr = Object.values(data)
      .filter(u => u.banned !== true)
      .map(u => ({
        name: u.name,
        point: Number(u.point || 0)
      }))
      .sort((a,b)=>b.point-a.point);

    arr.forEach((u,i)=>{

      const div = document.createElement("div");

      div.textContent =
        `${i+1}位　${u.name}　${u.point}pt`;

      box.appendChild(div);

    });

  });

};
/* ---------------- 履歴 ---------------- */
document.getElementById("logButton").onclick = () => {

  const uid = document.getElementById("userSelect").value;
  const box = document.getElementById("logList");

  onValue(ref(db, "logs/" + uid), snap => {

    const data = snap.val() || {};
    box.innerHTML = "";

    Object.values(data).forEach(l => {
      const div = document.createElement("div");
      div.textContent = `${l.action} / ${new Date(l.time).toLocaleString()}`;
      box.appendChild(div);
    });
  });
  
};
  onValue(ref(db,"rules"),snap=>{

  const data=snap.val();

  if(data){

    document.getElementById("ruleText").value=data.text;

  }

});
  document.getElementById("saveRule").onclick = async () => {

  const text = document.getElementById("ruleText").value;

  await set(ref(db,"rules"),{
    text:text
  });

  showToast("ルールを保存しました");

};
    /* ---------------- 通知 ---------------- */
function showToast(message) {

  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    toast.style.display = "none";
  }, 3000);

}


</script>

</body>
</html>
