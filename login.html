<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン</title>
</head>

<body>

<h1>ログイン</h1>

<input id="email" placeholder="メールアドレス"><br><br>
<input id="password" type="password" placeholder="パスワード"><br><br>

<button id="loginBtn">ログイン</button>
<button id="registerBtn">新規登録</button>

<p id="msg"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgILQJKJOiQ6gIeZPKhbVjdybXS_vsD3Q",
  authDomain: "kamadapoint.firebaseapp.com",
  databaseURL: "https://kamadapoint-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kamadapoint",
  storageBucket: "kamadapoint.firebasestorage.app",
  messagingSenderId: "601769416524",
  appId: "1:601769416524:web:0be49ce5a0baf87f75e1e9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const msg = document.getElementById("msg");

/* ---------------- ログイン ---------------- */
document.getElementById("loginBtn").onclick = async () => {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (!email || !password) {
    msg.textContent = "入力してください";
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, password);

    msg.textContent = "成功";

    location.href = "index.html";

  } catch (e) {
    msg.textContent = "ログイン失敗: " + e.message;
  }
};

/* ---------------- 新規登録へ移動 ---------------- */
document.getElementById("registerBtn").onclick = () => {
  location.href = "register.html";
};

</script>

</body>
</html>

</script>

</body>
</html>
