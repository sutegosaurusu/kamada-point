<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ポイント譲渡</title>

</head>

<body>

<button id="backButton">
← 戻る
</button>

<h1>ポイント譲渡</h1>

<hr>

<h2>現在のポイント</h2>

<div id="myPoint">
読み込み中...
</div>

<hr>

<h2>通常譲渡</h2>

<select id="giveUser">
<option value="">
譲渡先を選択
</option>
</select>

<br><br>

<input
type="number"
id="givePoint"
placeholder="譲渡ポイント">

<br><br>

<button id="giveButton">
譲渡する
</button>

<hr>

<h2>特別譲渡（手数料50%）</h2>

<select id="specialGiveUser">
<option value="">
譲渡先を選択
</option>
</select>

<br><br>

<input
type="number"
id="specialGivePoint"
placeholder="送るポイント">

<br><br>

<button id="specialGiveButton">
特別譲渡する
</button>

<hr>

<h2>ランキング</h2>

<div id="rankList">

読み込み中...

</div>

<hr>

<h2>譲渡履歴</h2>

<div id="transferLog">

読み込み中...

</div>

</body>
</html>
