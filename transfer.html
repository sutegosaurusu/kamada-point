<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ポイント譲渡</title>
  <style>

body{
    font-family:"Arial","Noto Sans JP",sans-serif;
    margin:0;
    padding:20px;
    background:linear-gradient(135deg,#ffe6f2,#e6f7ff);
    color:#333;
}

h1{
    text-align:center;
    color:#ff5c9a;
    font-size:32px;
    margin-bottom:25px;
}

h2{
    color:#555;
    border-left:6px solid #ff7eb3;
    padding-left:10px;
    margin-top:30px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    background:linear-gradient(135deg,#ff7eb3,#ff65a3);
    color:white;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(255,100,160,0.3);
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

#backButton{
    margin-bottom:20px;
}

input,
select{
    width:100%;
    max-width:350px;
    padding:12px;
    border:2px solid #ffd1e3;
    border-radius:15px;
    background:white;
    font-size:16px;
    box-sizing:border-box;
}

#myPoint,
#rankList,
#transferLog{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    margin-top:10px;
}

#myPoint{
    text-align:center;
    font-size:30px;
    color:#ff5c9a;
    font-weight:bold;
}

hr{
    border:none;
    height:2px;
    background:#ffd1e3;
    margin:30px 0;
}

@media(max-width:600px){

button{
    width:100%;
}

input,
select{
    max-width:100%;
}

}

</style>

</head>

<body>

<button id="backButton">
← 戻る
</button>

<h1>ポイント譲渡</h1>

<hr>

<h2>現在のポイント</h2>

<div id="myPoint">
読み込み中...
</div>

<hr>

<h2>通常譲渡</h2>

<select id="giveUser">
<option value="">
譲渡先を選択
</option>
</select>

<br><br>

<input
type="number"
id="givePoint"
placeholder="譲渡ポイント">

<br><br>

<button id="giveButton">
譲渡する
</button>

<hr>

<h2>特別譲渡（手数料50%）</h2>

<select id="specialGiveUser">
<option value="">
譲渡先を選択
</option>
</select>

<br><br>

<input
type="number"
id="specialGivePoint"
placeholder="送るポイント">

<br><br>

<button id="specialGiveButton">
特別譲渡する
</button>

<hr>

<h2>ランキング</h2>

<div id="rankList">

読み込み中...

</div>

<hr>

<h2>譲渡履歴</h2>

<div id="transferLog">

読み込み中...

</div>

</body>
</html>
