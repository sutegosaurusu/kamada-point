<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ポイント譲渡</title>
  <style>

body{
    font-family:"Arial","Noto Sans JP",sans-serif;
    margin:0;
    padding:20px;
    background:linear-gradient(135deg,#ffe6f2,#e6f7ff);
    color:#333;
}

h1{
    text-align:center;
    color:#ff5c9a;
    font-size:32px;
    margin-bottom:25px;
}

h2{
    color:#555;
    border-left:6px solid #ff7eb3;
    padding-left:10px;
    margin-top:30px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    background:linear-gradient(135deg,#ff7eb3,#ff65a3);
    color:white;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(255,100,160,0.3);
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

#backButton{
    margin-bottom:20px;
}

input,
select{
    width:100%;
    max-width:350px;
    padding:12px;
    border:2px solid #ffd1e3;
    border-radius:15px;
    background:white;
    font-size:16px;
    box-sizing:border-box;
}

#myPoint,
#rankList,
#transferLog{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    margin-top:10px;
}

#myPoint{
    text-align:center;
    font-size:30px;
    color:#ff5c9a;
    font-weight:bold;
}

hr{
    border:none;
    height:2px;
    background:#ffd1e3;
    margin:30px 0;
}

@media(max-width:600px){

button{
    width:100%;
}

input,
select{
    max-width:100%;
}

}

</style>

</head>

<body>

<button id="backButton">
← 戻る
</button>

<h1>ポイント譲渡</h1>

<hr>

<h2>現在のポイント</h2>

<div id="myPoint">
読み込み中...
</div>

<hr>

<h2>通常譲渡</h2>

<select id="giveUser">
<option value="">
譲渡先を選択
</option>
</select>

<br><br>

<input
type="number"
id="givePoint"
placeholder="譲渡ポイント">

<br><br>

<button id="giveButton">
譲渡する
</button>

<hr>

<h2>特別譲渡（手数料50%）</h2>

<select id="specialGiveUser">
<option value="">
譲渡先を選択
</option>
</select>

<br><br>

<input
type="number"
id="specialGivePoint"
placeholder="送るポイント">

<br><br>

<button id="specialGiveButton">
特別譲渡する
</button>

<hr>

<h2>ランキング</h2>

<div id="rankList">

読み込み中...

</div>

<hr>

<h2>譲渡履歴</h2>

<div id="transferLog">

読み込み中...

</div>
 

    <script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getDatabase,
ref,
get,
onValue,
push,
runTransaction
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {

  apiKey:"AIzaSyBgILQJKJOiQ6gIeZPKhbVjdybXS_vsD3Q",

  authDomain:"kamadapoint.firebaseapp.com",

  databaseURL:"https://kamadapoint-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:"kamadapoint",

  storageBucket:"kamadapoint.firebasestorage.app",

  messagingSenderId:"601769416524",

  appId:"1:601769416524:web:0be49ce5a0baf87f75e1e9"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

let uid = null;
let myPoint = 0;
let sending = false;
let specialSending = false;
      // ログイン確認
onAuthStateChanged(auth, async(user)=>{

  if(!user){
    location.href="login.html";
    return;
  }

  uid = user.uid;

  const snap = await get(ref(db,"members/"+uid));

  if(!snap.exists()){
    location.href="login.html";
    return;
  }

  const data = snap.val();

  if(data.banned === true){
    alert("BANされています");
    location.href="login.html";
    return;
  }

  // 現在ポイント表示
  onValue(ref(db,"members/"+uid),(snap)=>{

    const d = snap.val();

    if(!d) return;

    myPoint = Number(d.point || 0);

    document.getElementById("myPoint").textContent =
      myPoint + " pt";

  });
  });
  // 戻るボタン
document.getElementById("backButton").onclick = () => {
  location.href = "user.html";
};
  // 譲渡先一覧
onValue(ref(db, "members"), (snap) => {

  const data = snap.val() || {};

  const normal = document.getElementById("giveUser");
  const special = document.getElementById("specialGiveUser");

  normal.innerHTML = '<option value="">譲渡先を選択</option>';
  special.innerHTML = '<option value="">譲渡先を選択</option>';

  for(const id in data){

    // 自分は表示しない
    if(id === uid) continue;

    // BANユーザーは表示しない
    if(data[id].banned === true) continue;

    const option1 = document.createElement("option");
    option1.value = id;
    option1.textContent = data[id].name;
    normal.appendChild(option1);

    const option2 = document.createElement("option");
    option2.value = id;
    option2.textContent = data[id].name;
    special.appendChild(option2);

  }

});
      });
      // ランキング表示
onValue(ref(db, "members"), (snap)=>{

  const data = snap.val() || {};

  const box = document.getElementById("rankList");

  box.innerHTML = "";

  const list = Object.values(data)
    .filter(user => user.banned !== true)
    .sort((a,b) => Number(b.point || 0) - Number(a.point || 0));

  list.forEach((user,index)=>{

    const div = document.createElement("div");

    div.style.padding = "8px 0";

    div.textContent =
      `${index + 1}位　${user.name}　${Number(user.point || 0)} pt`;

    box.appendChild(div);

  });

});
      // 譲渡履歴
onValue(ref(db,"logs/"+uid),(snap)=>{

  const data = snap.val() || {};

  const box = document.getElementById("transferLog");

  box.innerHTML = "";

  const logs = Object.values(data)
    .sort((a,b)=>b.time-a.time);

  if(logs.length === 0){

    box.textContent = "履歴はありません";

    return;

  }

  logs.forEach(log=>{

    const div = document.createElement("div");

    div.style.padding = "8px 0";
    div.style.borderBottom = "1px solid #ffd1e3";

    div.textContent =
      log.action +
      "　" +
      new Date(log.time).toLocaleString();

    box.appendChild(div);

  });

});
      // ===============================
// 通常譲渡（前半）
// ===============================

document.getElementById("giveButton").onclick = async()=>{

  if(sending){
    alert("譲渡処理中です");
    return;
  }

  sending = true;

  const target =
    document.getElementById("giveUser").value;

  const point =
    Math.floor(Number(document.getElementById("givePoint").value));

  // 相手未選択
  if(!target){
    alert("譲渡先を選択してください");
    sending = false;
    return;
  }

  // 自分には送れない
  if(target === uid){
    alert("自分には譲渡できません");
    sending = false;
    return;
  }

  // 数値チェック
  if(isNaN(point) || point <= 0){
    alert("1ポイント以上入力してください");
    sending = false;
    return;
  }

  // 最大1000pt
  if(point > 1000){
    alert("通常譲渡は1000ptまでです");
    sending = false;
    return;
  }

  // ポイント不足
  if(myPoint < point){
    alert("ポイントが足りません");
    sending = false;
    return;
  }

  // 相手取得
  const targetSnap =
    await get(ref(db,"members/"+target));

  if(!targetSnap.exists()){
    alert("相手が見つかりません");
    sending = false;
    return;
  }

  const other = targetSnap.val();

  // BANチェック
  if(other.banned === true){
    alert("BANされたユーザーには送れません");
    sending = false;
    return;
  }

  // 確認画面
  const ok = confirm(
    other.name +
    " さんへ\n\n" +
    point +
    "pt 譲渡しますか？"
  );

  if(!ok){
    sending = false;
    return;
  }

  // runTransactionで安全に譲渡
const result = await runTransaction(ref(db, "members"), (members)=>{

  if(!members) return;

  const me = members[uid];
  const targetUser = members[target];

  if(!me || !targetUser) return;

  // 最新のポイントで再確認
  if(Number(me.point || 0) < point){
    return;
  }

  // 自分から減らす
  me.point = Number(me.point || 0) - point;

  // 相手へ加算
  targetUser.point = Number(targetUser.point || 0) + point;

  return members;

});

if(!result.committed){

  alert("譲渡に失敗しました");
  sending = false;
  return;

}

// ログ保存
await push(ref(db,"logs/"+uid),{

  action:`${other.name}さんへ${point}pt譲渡`,
  time:Date.now()

});

await push(ref(db,"logs/"+target),{
  const mySnap = await get(ref(db,"members/"+uid));
const me = mySnap.val();

action:`${me.name}さんから${point}pt受取`
  time:Date.now()

});

alert("譲渡が完了しました！");

document.getElementById("givePoint").value = "";
document.getElementById("giveUser").selectedIndex = 0;

sending = false;

};
// ===============================
// 特別譲渡（50%受取）
// ===============================

document.getElementById("specialGiveButton").onclick = async()=>{

  if(specialSending){
    alert("処理中です");
    return;
  }

  specialSending = true;

  const target =
    document.getElementById("specialGiveUser").value;

  const point =
    Math.floor(Number(document.getElementById("specialGivePoint").value));

  if(!target){
    alert("譲渡先を選択してください");
    specialSending = false;
    return;
  }

  if(target === uid){
    alert("自分には譲渡できません");
    specialSending = false;
    return;
  }

  if(isNaN(point) || point <= 0){
    alert("1ポイント以上入力してください");
    specialSending = false;
    return;
  }

  if(myPoint < point){
    alert("ポイントが足りません");
    specialSending = false;
    return;
  }

  const targetSnap = await get(ref(db,"members/"+target));

  if(!targetSnap.exists()){
    alert("相手が見つかりません");
    specialSending = false;
    return;
  }

  const other = targetSnap.val();

  if(other.banned === true){
    alert("BANされたユーザーには送れません");
    specialSending = false;
    return;
  }

  const receivePoint = Math.floor(point / 2);

  if(!confirm(
    `${other.name}さんへ${point}pt送ります。\n\n` +
    `相手の受取：${receivePoint}pt\n` +
    `消滅：${point - receivePoint}pt`
  )){
    specialSending = false;
    return;
  }

  const result = await runTransaction(ref(db,"members"),(members)=>{

    if(!members) return;

    const me = members[uid];
    const targetUser = members[target];

    if(!me || !targetUser) return;

    if(Number(me.point || 0) < point){
      return;
    }

    me.point = Number(me.point || 0) - point;
    targetUser.point = Number(targetUser.point || 0) + receivePoint;

    return members;

  });

  if(!result.committed){
    alert("譲渡に失敗しました");
    specialSending = false;
    return;
  }

  const mySnap = await get(ref(db,"members/"+uid));
  const me = mySnap.val();

  await push(ref(db,"logs/"+uid),{
    action:`${other.name}さんへ特別譲渡 ${point}pt（相手受取${receivePoint}pt）`,
    time:Date.now()
  });

  await push(ref(db,"logs/"+target),{
    action:`${me.name}さんから特別譲渡 ${receivePoint}pt受取`,
    time:Date.now()
  });

  alert("特別譲渡が完了しました！");

  document.getElementById("specialGivePoint").value = "";
  document.getElementById("specialGiveUser").selectedIndex = 0;

  specialSending = false;

};


</script>

</body>
</html>
