<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ポイント譲渡</title>
  <style>

body{
    font-family:"Arial","Noto Sans JP",sans-serif;
    margin:0;
    padding:20px;
    background:linear-gradient(135deg,#ffe6f2,#e6f7ff);
    color:#333;
}

h1{
    text-align:center;
    color:#ff5c9a;
    font-size:32px;
    margin-bottom:25px;
}

h2{
    color:#555;
    border-left:6px solid #ff7eb3;
    padding-left:10px;
    margin-top:30px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    background:linear-gradient(135deg,#ff7eb3,#ff65a3);
    color:white;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(255,100,160,0.3);
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

#backButton{
    margin-bottom:20px;
}

input,
select{
    width:100%;
    max-width:350px;
    padding:12px;
    border:2px solid #ffd1e3;
    border-radius:15px;
    background:white;
    font-size:16px;
    box-sizing:border-box;
}

#myPoint,
#rankList,
#transferLog{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    margin-top:10px;
}

#myPoint{
    text-align:center;
    font-size:30px;
    color:#ff5c9a;
    font-weight:bold;
}

hr{
    border:none;
    height:2px;
    background:#ffd1e3;
    margin:30px 0;
}

@media(max-width:600px){

button{
    width:100%;
}

input,
select{
    max-width:100%;
}

}

</style>

</head>

<body>

<button id="backButton">
← 戻る
</button>

<h1>ポイント譲渡</h1>

<hr>

<h2>現在のポイント</h2>

<div id="myPoint">
読み込み中...
</div>

<hr>

<h2>通常譲渡</h2>

<select id="giveUser">
<option value="">
譲渡先を選択
</option>
</select>

<br><br>

<input
type="number"
id="givePoint"
placeholder="譲渡ポイント">

<br><br>

<button id="giveButton">
譲渡する
</button>

<hr>

<h2>特別譲渡（手数料50%）</h2>

<select id="specialGiveUser">
<option value="">
譲渡先を選択
</option>
</select>

<br><br>

<input
type="number"
id="specialGivePoint"
placeholder="送るポイント">

<br><br>

<button id="specialGiveButton">
特別譲渡する
</button>

<hr>

<h2>ランキング</h2>

<div id="rankList">

読み込み中...

</div>

<hr>

<h2>譲渡履歴</h2>

<div id="transferLog">

読み込み中...

</div>
 

    <script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getDatabase,
ref,
get,
onValue,
push,
runTransaction
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {

  apiKey:"AIzaSyBgILQJKJOiQ6gIeZPKhbVjdybXS_vsD3Q",

  authDomain:"kamadapoint.firebaseapp.com",

  databaseURL:"https://kamadapoint-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:"kamadapoint",

  storageBucket:"kamadapoint.firebasestorage.app",

  messagingSenderId:"601769416524",

  appId:"1:601769416524:web:0be49ce5a0baf87f75e1e9"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

let uid = null;
let myPoint = 0;
let sending = false;
let specialSending = false;
      // ログイン確認
onAuthStateChanged(auth, async(user)=>{

  if(!user){
    location.href="login.html";
    return;
  }

  uid = user.uid;

  const snap = await get(ref(db,"members/"+uid));

  if(!snap.exists()){
    location.href="login.html";
    return;
  }

  const data = snap.val();

  if(data.banned === true){
    alert("BANされています");
    location.href="login.html";
    return;
  }

  // 現在ポイント表示
  onValue(ref(db,"members/"+uid),(snap)=>{

    const d = snap.val();

    if(!d) return;

    myPoint = Number(d.point || 0);

    document.getElementById("myPoint").textContent =
      myPoint + " pt";

  });
  // 戻るボタン
document.getElementById("backButton").onclick = () => {
  location.href = "user.html";
};
  // 譲渡先一覧
onValue(ref(db, "members"), (snap) => {

  const data = snap.val() || {};

  const normal = document.getElementById("giveUser");
  const special = document.getElementById("specialGiveUser");

  normal.innerHTML = '<option value="">譲渡先を選択</option>';
  special.innerHTML = '<option value="">譲渡先を選択</option>';

  for(const id in data){

    // 自分は表示しない
    if(id === uid) continue;

    // BANユーザーは表示しない
    if(data[id].banned === true) continue;

    const option1 = document.createElement("option");
    option1.value = id;
    option1.textContent = data[id].name;
    normal.appendChild(option1);

    const option2 = document.createElement("option");
    option2.value = id;
    option2.textContent = data[id].name;
    special.appendChild(option2);

  }

});

});

</script>

</body>
</html>
