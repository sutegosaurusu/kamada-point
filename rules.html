<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鎌田ポイントルール</title>

<style>
body{
    font-family:"Arial","Noto Sans JP",sans-serif;
    margin:0;
    padding:20px;
    background:linear-gradient(135deg,#ffe6f2,#e6f7ff);
    color:#333;
}

h1{
    text-align:center;
    color:#ff5c9a;
    font-size:32px;
    margin-bottom:25px;
}

#rule{
    white-space:pre-wrap;
    background:white;
    border:3px solid #ffe0ef;
    padding:20px;
    border-radius:25px;
    min-height:250px;
    font-size:16px;
    line-height:1.8;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

button{
    display:block;
    margin:25px auto;
    padding:12px 35px;
    border:none;
    border-radius:25px;
    background:linear-gradient(135deg,#ff7eb3,#ff65a3);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(255,100,160,0.3);
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}
</style>

</head>

<body>

<h1>鎌田ポイント 現行ルール</h1>

<div id="rule">
読み込み中...
</div>

<br>

<button onclick="history.back()">
戻る
</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgILQJKJOiQ6gIeZPKhbVjdybXS_vsD3Q",
  authDomain: "kamadapoint.firebaseapp.com",
  databaseURL: "https://kamadapoint-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kamadapoint",
  storageBucket: "kamadapoint.firebasestorage.app",
  messagingSenderId: "601769416524",
  appId: "1:601769416524:web:0be49ce5a0baf87f75e1e9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

onValue(ref(db, "rules"), (snap) => {

  const data = snap.val();

  if (data && data.text) {
    document.getElementById("rule").textContent = data.text;
  } else {
    document.getElementById("rule").textContent = "現在ルールは登録されていません。";
  }

});

</script>

</body>
</html>
