<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鎌田ポイントルール</title>

<style>
body{
    font-family:sans-serif;
    margin:20px;
}

h1{
    text-align:center;
}

#rule{
    white-space:pre-wrap;
    border:1px solid #ccc;
    padding:15px;
    border-radius:8px;
    background:#f8f8f8;
    min-height:250px;
    font-size:16px;
}

button{
    padding:10px 20px;
    margin-top:20px;
}
</style>

</head>

<body>

<h1>鎌田ポイント 現行ルール</h1>

<div id="rule">
読み込み中...
</div>

<br>

<button onclick="history.back()">
戻る
</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgILQJKJOiQ6gIeZPKhbVjdybXS_vsD3Q",
  authDomain: "kamadapoint.firebaseapp.com",
  databaseURL: "https://kamadapoint-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kamadapoint",
  storageBucket: "kamadapoint.firebasestorage.app",
  messagingSenderId: "601769416524",
  appId: "1:601769416524:web:0be49ce5a0baf87f75e1e9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

onValue(ref(db, "rules"), (snap) => {

  const data = snap.val();

  if (data && data.text) {
    document.getElementById("rule").textContent = data.text;
  } else {
    document.getElementById("rule").textContent = "現在ルールは登録されていません。";
  }

});

</script>

</body>
</html>
