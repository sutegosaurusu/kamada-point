<html lang="ja">

<head>

<meta charset="UTF-8">

<title>スレ</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:"Arial","Noto Sans JP",sans-serif;
    padding:20px;
    background:linear-gradient(135deg,#ffe6f2,#e6f7ff);
}

h1{
    word-break:break-word;
}

.card{
    background:white;
    padding:8px 12px;
    margin:6px 0;
    border-radius:10px;
    box-shadow:0 1px 4px #ddd;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
}

textarea{
    width:100%;
    min-height:100px;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
    resize:vertical;
    font-family:"Arial","Noto Sans JP",sans-serif;
}
#text.aaInput{
    width:100%;
    height:400px;
    min-height:250px;
    max-height:70vh;

    padding:12px;
    box-sizing:border-box;

    white-space:pre;

    /* 横にはみ出したAAは横スクロール */
    overflow-x:auto;

    /* 縦もスクロール可能 */
    overflow-y:auto;

    font-family:
        "MS Gothic",
        "ＭＳ ゴシック",
        "MS PGothic",
        "ＭＳ Ｐゴシック",
        monospace;

    font-size:14px;
    line-height:1;
    letter-spacing:0;

    word-break:normal;
    overflow-wrap:normal;

    resize:vertical;

    border:1px solid #ccc;
    border-radius:10px;

    background:white;
}
button{
    padding:10px 20px;
    border:none;
    border-radius:20px;
    background:#ff8fcf;
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:.85;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* 名前 */

.name{
    font-weight:bold;
    cursor:pointer;

    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;

    touch-action:manipulation;
}

/* 時間 */

.time{
    font-size:12px;
    color:#777;
    margin-top:6px;
}

/* いいね */

.likeBtn{
    display:inline-block;
    cursor:pointer;
    color:#ff5ca8;
    font-size:14px;
    margin-top:4px;
    user-select:none;
    margin-bottom:2px;
}

.likeBtn:hover{
    opacity:.7;
}

/* 返信 */

.reply{
    font-size:11px;
    color:#888;
    margin-bottom:4px;
    padding-left:6px;
    border-left:3px solid #ffd1e3;
}

/* 通常本文 */

.textContent{
    white-space:pre-wrap;
    word-break:break-word;
    margin-top:8px;
}

/* AA */

.aaContent{
    margin-top:8px;

    /* 改行・半角スペースを完全維持 */
    white-space:pre;

    /* 横に長いAAはスクロール */
    overflow-x:auto;
    overflow-y:hidden;

    /* AA用の等幅フォント */
    font-family:
        "MS Gothic",
        "ＭＳ ゴシック",
        "MS PGothic",
        "ＭＳ Ｐゴシック",
        "Courier New",
        monospace;

    /* AAの幅を内容に合わせる */
    width:100%;
    min-width:0;

    /* 文字サイズと行間を固定 */
    font-size:14px;
    line-height:1.0;

    /* ブラウザによる文字間隔の調整を抑える */
    letter-spacing:0;

    /* 強制的な折り返しを禁止 */
    word-break:normal;
    overflow-wrap:normal;

    /* 見た目 */
    background:#fafafa;
    border:1px solid #eee;
    border-radius:8px;

    padding:12px;

    /* タップ時も横スクロールしやすくする */
    -webkit-overflow-scrolling:touch;

    /* AAの選択を許可 */
    user-select:text;
}

/* 画像 */

.imagePost{
    display:block;

    max-width:100%;
    width:auto;
    height:auto;

    max-height:600px;

    border-radius:8px;

    margin-top:8px;

    object-fit:contain;
}

/* 投稿形式 */

.postTypeButtons{
    display:flex;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;

.postTypeBtn{
    background:#ddd;
    color:#555;
}

.postTypeBtn.active{
    background:#ff8fcf;
    color:white;
}

/* 返信中 */

#replyBox{
    display:none;

    margin-bottom:10px;

    background:#fff3f8;

    padding:8px 12px;

    border-radius:10px;
}

/* 画像選択部分 */

#imageArea{
    display:none;
    margin-bottom:10px;
}

#imageInput{
    background:white;
}

/* プレビュー */

#imagePreviewBox{
    display:none;
    margin-top:10px;
}

#imagePreview{
    display:block;

    max-width:100%;
    max-height:300px;

    border-radius:8px;

/* 状態 */

#uploadStatus{

    font-size:13px;
    color:#777;

    box-shadow:0 1px 4px #ddd;

    font-size:13px;
    color:#666;

    white-space:nowrap;

    z-index:1000;

// =====================================================
// 画像圧縮
// =====================================================

async function compressImage(file){

    const MAX_WIDTH =
        800;


    const MAX_HEIGHT =
        800;


    const TARGET_SIZE =
        300 * 1024;


    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    const img =
                        new Image();


                    img.onload =
                        function(){

                            let width =
                                img.width;


                            let height =
                                img.height;


                            // -----------------------------
                            // サイズ計算
                            // -----------------------------

                            const scale =
                                Math.min(
                                    MAX_WIDTH / width,
                                    MAX_HEIGHT / height,
                                    1
                                );


                            width =
                                Math.round(
                                    width * scale
                                );


                            height =
                                Math.round(
                                    height * scale
                                );


                            // -----------------------------
                            // Canvas
                            // -----------------------------

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;


                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            // -----------------------------
                            // JPEG圧縮
                            // -----------------------------

                            let quality =
                                0.8;


                            let dataUrl =
                                canvas.toDataURL(
                                    "image/jpeg",
                                    quality
                                );


                            // -----------------------------
                            // 徐々に圧縮
                            // -----------------------------

                            while(
                                dataUrl.length >
                                TARGET_SIZE * 1.37
                                &&
                                quality > 0.3
                            ){

                                quality -= 0.1;


                                dataUrl =
                                    canvas.toDataURL(
                                        "image/jpeg",
                                        quality
                                    );

                            }


                            // -----------------------------
                            // それでも大きい場合
                            // -----------------------------

                            if(
                                dataUrl.length >
                                TARGET_SIZE * 1.37
                            ){

                                const smallCanvas =
                                    document.createElement(
                                        "canvas"
                                    );


                                smallCanvas.width =
                                    Math.max(
                                        1,
                                        Math.round(
                                            width * 0.7
                                        )
                                    );


                                smallCanvas.height =
                                    Math.max(
                                        1,
                                        Math.round(
                                            height * 0.7
                                        )
                                    );


                                const smallCtx =
                                    smallCanvas.getContext(
                                        "2d"
                                    );


                                smallCtx.drawImage(
                                    canvas,
                                    0,
                                    0,
                                    smallCanvas.width,
                                    smallCanvas.height
                                );


                                dataUrl =
                                    smallCanvas.toDataURL(
                                        "image/jpeg",
                                        0.6
                                    );

                            }


                            resolve(
                                dataUrl
                            );

                        };


                    img.onerror =
                        function(){

                            reject(
                                new Error(
                                    "画像を読み込めませんでした"
                                )
                            );

                        };


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                function(){

                    reject(
                        new Error(
                            "画像ファイルを読み込めませんでした"
                        )
                    );

                };


            reader.readAsDataURL(file);

        }
    );

}


// =====================================================
// 画像選択
// =====================================================

imageInput.addEventListener(
    "change",
    async()=>{

        const file =
            imageInput.files[0];


        if(!file){

            imagePreviewBox.style.display =
                "none";


            imagePreview.src =
                "";


            uploadStatus.textContent =
                "";


            return;

        }


        // -----------------------------
        // ファイル形式
        // -----------------------------

        if(
            !file.type.startsWith("image/")
        ){

            alert(
                "画像ファイルを選択してください"
            );


            imageInput.value =
                "";


            return;

        }


        // -----------------------------
        // 元画像5MB制限
        // -----------------------------

        if(
            file.size >
            5 * 1024 * 1024
        ){

            alert(
                "元画像は5MB以下にしてください"
            );


            imageInput.value =
                "";


            return;

        }


        try{

            uploadStatus.textContent =
                "画像を縮小しています……";


            const compressed =
                await compressImage(
                    file
                );


            imagePreview.src =
                compressed;


            imagePreviewBox.style.display =
                "block";


            uploadStatus.textContent =
                "画像の準備ができました";

        }
        catch(error){

            console.error(
                error
            );


            alert(
                "画像の処理に失敗しました"
            );


            imageInput.value =
                "";

        }

    }
);


// =====================================================
// ランク更新
// =====================================================

async function updateRank(uid){

    const memberRef =
        ref(
            db,
            "members/" + uid
        );


    const snap =
        await get(
            memberRef
        );


    if(!snap.exists())
        return;


    const member =
        snap.val();


    let rank =
        member.rank || "新人";


    if(
        member.lastPostDate &&
        Date.now() -
        member.lastPostDate <
        259200000
    ){

        rank =
            "常連";

    }


    await update(
        memberRef,
        {
            rank:rank
        }
    );

}


// =====================================================
// 名人チェック
// =====================================================

async function checkMaster(
    uid,
    likes
){

    if(likes < 20)
        return;


    const memberRef =
        ref(
            db,
            "members/" + uid
        );


    const snap =
        await get(
            memberRef
        );


    if(!snap.exists())
        return;


    const member =
        snap.val();


    if(
        member.rank !== "名人"
    ){

        await update(
            memberRef,
            {
                rank:
                    "名人",

                badge:
                    "🏆 名人"
            }
        );


        alert(
            "名人ランクになりました！"
        );

    }

}

document

        replyTo =
            null;


        replyBox.style.display =

// =====================================================
// スレ読み込み
// =====================================================

onValue(
    threadRef,
    (snapshot)=>{

        const data =
            snapshot.val();


        if(!data){

            title.textContent =
                "スレがありません";


            posts.innerHTML =
                "";


            return;

        }


        title.textContent =
            data.title ||
            "無題";


        posts.innerHTML =
            "";


        if(!data.posts)
            return;


        Object.entries(
            data.posts
        )
        .forEach(
            ([postId,post])=>{

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "card";


                // =================================================
                // 返信表示
                // =================================================

                const replyDiv =
                    document.createElement(
                        "div"
                    );


                replyDiv.className =
                    "reply";


                if(
                    post.replyTo &&
                    data.posts[post.replyTo]
                ){

                    replyDiv.textContent =
                        "↩ " +
                        (
                            data
                                .posts
                                [post.replyTo]
                                .name
                            ||
                            "名無し"
                        ) +
                        " に返信";

                }


                div.appendChild(
                    replyDiv
                );


                // =================================================
                // 名前
                // =================================================

                const nameDiv =
                    document.createElement(
                        "div"
                    );


                nameDiv.className =
                    "name";


                nameDiv.textContent =
                    post.name ||
                    "名無し";


                const rankSpan =
                    document.createElement(
                        "span"
                    );


                rankSpan.id =
                    "rank-" +
                    postId;


                nameDiv.appendChild(
                    rankSpan
                );


                div.appendChild(
                    nameDiv
                );


                // =================================================
                // 投稿本文
                // =================================================

                if(
                    post.type ===
                    "image"
                ){

                    // ----------------------------
                    // 画像
                    // ----------------------------

                    if(
                        post.imageData
                    ){

                        const img =
                            document.createElement(
                                "img"
                            );


                        img.className =
                            "imagePost";


                        img.src =
                            post.imageData;


                        img.alt =
                            "投稿画像";


                        img.loading =
                            "lazy";


                        div.appendChild(
                            img
                        );

                    }


                    // ----------------------------
                    // コメント
                    // ----------------------------

                    if(
                        post.text
                    ){

                        const comment =
                            document.createElement(
                                "div"
                            );


                        comment.className =
                            "textContent";


                        comment.textContent =
                            post.text;


                        div.appendChild(
                            comment
                        );

                    }

                }
                else if(
                    post.type ===
                    "aa"
                ){

                   const aa =
    document.createElement(
        "pre"
    );

aa.className =
    "aaContent";

aa.textContent =
    post.text ||
    "";

div.appendChild(
    aa
);
                }
                else{

                    // ----------------------------
                    // 通常投稿
                    // ----------------------------

                    const textDiv =
                        document.createElement(
                            "div"
                        );


                    textDiv.className =
                        "textContent";


                    textDiv.textContent =
                        post.text ||
                        "";


                    div.appendChild(
                        textDiv
                    );

                }


                // =================================================
                // 時間
                // =================================================

                const timeDiv =
                    document.createElement(
                        "div"
                    );


                timeDiv.className =
                    "time";


                timeDiv.textContent =
                    post.time
                    ?
                    new Date(
                        post.time
                    ).toLocaleString()
                    :
                    "";


                div.appendChild(
                    timeDiv
                );


                // =================================================
                // いいね
                // =================================================

                const likeBtn =
                    document.createElement(
                        "p"
                    );


                likeBtn.className =
                    "likeBtn";


                likeBtn.textContent =
                    "👍 " +
                    (
                        post.likes ||
                        0
                    );


                div.appendChild(
                    likeBtn
                );


                // =================================================
                // いいね処理
                // =================================================

                likeBtn.onclick =
                    async(e)=>{

                        e.stopPropagation();


                        if(!currentUser){

                            alert(
                                "ログインしてください"
                            );


                            return;

                        }


                        // -------------------------
                        // 自分の投稿
                        // -------------------------

                        if(
                            post.uid ===
                            currentUser.uid
                        ){

                            alert(
                                "自分の投稿にはいいねできません"
                            );


                            return;

                        }


                        const likeRef =
                            ref(
                                db,
                                "board/threads/" +
                                threadId +
                                "/posts/" +
                                postId +
                                "/likedUsers/" +
                                currentUser.uid
                            );


                        const likeSnap =
                            await get(
                                likeRef
                            );


                        if(
                            likeSnap.exists()
                        ){

                            alert(
                                "すでにいいねしています"
                            );


                            return;

                        }


                        // -------------------------
                        // いいね記録
                        // -------------------------

                        await set(
                            likeRef,
                            true
                        );


                        const newLikes =
                            (
                                post.likes ||
                                0
                            ) +
                            1;


                        await update(
                            ref(
                                db,
                                "board/threads/" +
                                threadId +
                                "/posts/" +
                                postId
                            ),
                            {
                                likes:
                                    newLikes
                            }
                        );


                        // -------------------------
                        // いいね報酬
                        // -------------------------

                        const authorRef =
                            ref(
                                db,
                                "members/" +
                                post.uid
                            );


                        const authorSnap =
                            await get(
                                authorRef
                            );


                        if(
                            authorSnap.exists()
                        ){

                            const author =
                                authorSnap.val();


                            let addPoint =
                                1;


                            // 10いいね
                            if(
                                newLikes >= 10 &&
                                !post.likeReward10
                            ){

                                addPoint +=
                                    20;


                                await update(
                                    ref(
                                        db,
                                        "board/threads/" +
                                        threadId +
                                        "/posts/" +
                                        postId
                                    ),
                                    {
                                        likeReward10:
                                            true
                                    }
                                );

                            }


                            // 50いいね
                            if(
                                newLikes >= 50 &&
                                !post.likeReward50
                            ){

                                addPoint +=
                                    200;


                                await update(
                                    ref(
                                        db,
                                        "board/threads/" +
                                        threadId +
                                        "/posts/" +
                                        postId
                                    ),
                                    {
                                        likeReward50:
                                            true
                                    }
                                );

                            }


                            // -------------------------
                            // ポイント付与
                            // -------------------------

                            await update(
                                authorRef,
                                {
                                    point:
                                        (
                                            author.point ||
                                            0
                                        ) +
                                        addPoint
                                }
                            );


                            // -------------------------
                            // 通知
                            // -------------------------

                            const notificationRef =
                                push(
                                    ref(
                                        db,
                                        "notifications/" +
                                        post.uid
                                    )
                                );


                            await set(
                                notificationRef,
                                {

                                    text:
                                        userName +
                                        "さんがあなたの投稿にいいねしました",

                                    point:
                                        addPoint,

                                    read:
                                        false,

                                    time:
                                        Date.now()

                                }
                            );


                            await checkMaster(
                                post.uid,
                                newLikes
                            );

                        }

                    };


                // =================================================
                // ランク取得
                // =================================================

                const rankRef =
                    ref(
                        db,
                        "members/" +
                        post.uid
                    );


                get(
                    rankRef
                )
                .then(
                    (snap)=>{

                        if(
                            !snap.exists()
                        )
                            return;


                        const member =
                            snap.val();


                        const rank =
                            member.rank ||
                            "新人";


                        const badge =
                            member.badge ||
                            "";


                        rankSpan.textContent =
                            " [" +
                            rank +
                            "] " +
                            badge;

                    }
                );


                // =================================================
                // 名前クリックで返信
                // =================================================

                nameDiv.onclick =
                    ()=>{

                        replyTo =
                            postId;


                        replyBox.style.display =
                            "block";


                        replyName.textContent =
                            post.name ||
                            "名無し";


                        text.focus();

                    };


                posts.appendChild(
                    div
                );

            }
        );

    }
);


// =====================================================
// 投稿
// =====================================================

sendButton.onclick =
    async()=>{

        // =================================================
        // ログイン確認
        // =================================================

        if(!currentUser){

            alert(
                "ログイン情報を読み込み中です"
            );


            return;

        }


        const uid =
            currentUser.uid;


        const name =
            userName;


        const textValue =
            text.value;


        const file =
            imageInput.files[0];


        // =================================================
        // 入力チェック
        // =================================================

        if(
            currentPostType ===
            "image"
        ){

            if(!file){

                alert(
                    "画像を選択してください"
                );


                return;

            }


            if(
                !file.type.startsWith(
                    "image/"
                )
            ){

                alert(
                    "画像ファイルを選択してください"
                );


                return;

            }


            if(
                file.size >
                5 * 1024 * 1024
            ){

                alert(
                    "元画像は5MB以下にしてください"
                );


                return;

            }

        }
        else{

            if(
                textValue.trim() ===
                ""
            ){

                alert(
                    "文字を入力してください"
                );


                return;

            }

        }


        // =================================================
        // ボタン無効
        // =================================================

        sendButton.disabled =
            true;


        try{

            // =================================================
            // 投稿先
            // =================================================

            const postRef =
                push(
                    ref(
                        db,
                        "board/threads/" +
                        threadId +
                        "/posts"
                    )
                );


            let imageData =
                "";


            // =================================================
            // 画像処理
            // =================================================

            if(
                currentPostType ===
                "image"
            ){

                uploadStatus.textContent =
                    "画像を縮小・圧縮しています……";


                imageData =
                    await compressImage(
                        file
                    );


                // Base64のサイズ確認
                if(
                    imageData.length >
                    500000
                ){

                    alert(
                        "画像が大きすぎます。もう少し小さい画像を選んでください。"
                    );


                    sendButton.disabled =
                        false;


                    return;

                }


                uploadStatus.textContent =
                    "画像を投稿しています……";

            }


            // =================================================
            // 投稿データ
            // =================================================

            const postData = {

                type:
                    currentPostType,

                text:
                    textValue,

                uid:
                    uid,

                name:
                    name,

                time:
                    Date.now(),

                replyTo:
                    replyTo ||
                    ""

            };


            // =================================================
            // 画像データ
            // =================================================

            if(
                currentPostType ===
                "image"
            ){

                postData.imageData =
                    imageData;

            }


            // =================================================
            // Firebaseへ保存
            // =================================================

            await set(
                postRef,
                postData
            );


            // =================================================
            // 返信通知
            // =================================================

            if(
                replyTo &&
                replyTo !== ""
            ){

                const parentSnapshot =
                    await get(
                        ref(
                            db,
                            "board/threads/" +
                            threadId +
                            "/posts/" +
                            replyTo
                        )
                    );


                const parentPost =
                    parentSnapshot.val();


                if(
                    parentPost &&
                    parentPost.uid !== uid
                ){

                    const notificationRef =
                        push(
                            ref(
                                db,
                                "notifications/" +
                                parentPost.uid
                            )
                        );


                    await set(
                        notificationRef,
                        {

                            text:
                                userName +
                                "さんがあなたの投稿に返信しました",

                            read:
                                false,

                            time:
                                Date.now(),

                            threadId:
                                threadId,

                            postId:
                                postRef.key

                        }
                    );

                }

            }


            // =================================================
            // 返信解除
            // =================================================

            replyTo =
                null;


            replyBox.style.display =
                "none";


            // =================================================
            // 投稿記録
            // =================================================

            await update(
                ref(
                    db,
                    "members/" +
                    uid
                ),
                {
                    lastPostDate:
                        Date.now()
                }
            );


            await updateRank(
                uid
            );


            // =================================================
            // 投稿報酬
            // =================================================

            const today =
                new Date()
                    .toLocaleDateString();


            const memberRef =
                ref(
                    db,
                    "members/" +
                    uid
                );


            const memberSnap =
                await get(
                    memberRef
                );


            if(
                memberSnap.exists()
            ){

                const member =
                    memberSnap.val();


                let reward =
                    member.boardRewardToday ||
                    0;


                let rewardDate =
                    member.boardRewardDate ||
                    "";


                // -----------------------------
                // 日付変更
                // -----------------------------

                if(
                    rewardDate !==
                    today
                ){

                    reward =
                        0;

                }


                // -----------------------------
                // 上限100pt
                // -----------------------------

                if(
                    reward < 100
                ){

                    const addPoint =
                        Math.min(
                            5,
                            100 - reward
                        );


                    await update(
                        memberRef,
                        {

                            point:
                                (
                                    member.point ||
                                    0
                                ) +
                                addPoint,

                            boardRewardDate:
                                today,

                            boardRewardToday:
                                reward +
                                addPoint,

                            lastPostDate:
                                Date.now()

                        }
                    );


                    await updateRank(
                        uid
                    );


                    alert(
                        "掲示板投稿報酬 +" +
                        addPoint +
                        "pt"
                    );

                }
                else{

                    alert(
                        "今日の掲示板報酬上限に達しています"
                    );

                }

            }


            // =================================================
            // 入力欄リセット
            // =================================================

            text.value =
                "";


            imageInput.value =
                "";


            imagePreview.src =
                "";


            imagePreviewBox.style.display =
                "none";


            uploadStatus.textContent =
                "";


            setPostType(
                "text"
            );

        }
        catch(error){

            console.error(
                "投稿エラー:",
                error
            );


            alert(
                "投稿に失敗しました\n" +
                error.message
            );

        }
        finally{

            sendButton.disabled =
                false;

        }

    };


// =====================================================
// 初期状態
// =====================================================

setPostType(
    "text"
);


</script>
