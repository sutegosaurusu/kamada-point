<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>スレ</title>

<style>

body{

font-family:"Arial","Noto Sans JP",sans-serif;
padding:20px;
background:linear-gradient(135deg,#ffe6f2,#e6f7ff);

}


.card{

background:white;
padding:15px;
margin:10px 0;
border-radius:15px;
box-shadow:0 3px 10px #ccc;

}


input{

width:80%;
padding:12px;
border-radius:10px;
border:1px solid #ccc;

}


button{

padding:10px 20px;
border:none;
border-radius:20px;
background:#ff8fcf;
color:white;

}


.name{

font-weight:bold;

}


.time{

font-size:12px;
color:#777;

}

</style>


</head>


<body>





<h1 id="title">

読み込み中

</h1>


<div id="posts">

</div>



<hr>


<h2>書き込み</h2>


<input id="text" placeholder="コメントを書く">


<button id="send">

投稿

</button>
  <hr>
<button onclick="location.href='board.html'">

←掲示板へ戻る

</button>



<script type="module">


import { initializeApp }

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getDatabase,
ref,
onValue,
push,
set,
get,
update

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


import {

getAuth,
onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



// Firebase設定

const firebaseConfig = {

apiKey:"AIzaSyBgILQJKJOiQ6gIeZPKhbVjdybXS_vsD3Q",

authDomain:"kamadapoint.firebaseapp.com",

databaseURL:"https://kamadapoint-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"kamadapoint",

storageBucket:"kamadapoint.firebasestorage.app",

messagingSenderId:"601769416524",

appId:"1:601769416524:web:0be49ce5a0baf87f75e1e9"

};



const app =
initializeApp(firebaseConfig);




const db =
getDatabase(app);


// ↓ここから追加

async function updateRank(uid){


const memberRef =
ref(db,"members/"+uid);


const snap =
await get(memberRef);


if(!snap.exists()) return;


const member =
snap.val();



let rank = member.rank || "新人";



if(
member.lastPostDate &&
Date.now()-member.lastPostDate
<
259200000
){

rank="常連";

}


await update(memberRef,{

rank:rank

});


}


// 名人チェック

async function checkMaster(uid,likes){

if(likes < 20) return;



const memberRef =
ref(db,"members/"+uid);



const snap =
await get(memberRef);



if(!snap.exists()) return;



const member =
snap.val();



if(member.rank !== "名人"){


await update(memberRef,{

rank:"名人",

badge:"🏆 名人"

});


alert("名人ランクになりました！");


}


}


// ↑ここまで追加
  const auth =
getAuth(app);


let currentUser = null;

let userName = "名無し";


onAuthStateChanged(auth,async(user)=>{


if(!user){

alert("ログインしてください");

location.href="login.html";

return;

}


currentUser=user;



const userRef =
ref(db,"members/"+user.uid);



const snap =
await get(userRef);



if(snap.exists()){

userName =
snap.val().name;

}


});



// URLからスレID取得

const params =
new URLSearchParams(location.search);


const threadId =
params.get("id");



// スレデータ

const threadRef =
ref(db,"board/threads/"+threadId);



const title =
document.getElementById("title");


const posts =
document.getElementById("posts");




// スレ読み込み

onValue(threadRef,(snapshot)=>{


const data =
snapshot.val();


if(!data){

title.innerHTML="スレがありません";

return;

}



title.innerHTML=data.title;



posts.innerHTML="";



// レス表示

if(data.posts){

Object.entries(data.posts)
.forEach(([postId,post])=>{

const div =
document.createElement("div");


div.className="card";


div.innerHTML=`

<div class="name">

${post.name}

<span id="rank-${postId}">
</span>

</div>

<p>

${post.text}

</p>


<div class="time">

${new Date(post.time)
.toLocaleString()}

</div>
<p>

👍 ${post.likes || 0}

</p>


<button class="likeBtn">

いいね

</button>

`;

  const likeBtn =
div.querySelector(".likeBtn");


likeBtn.onclick=async()=>{


if(!currentUser){

alert("ログインしてください");

return;

}



// 自分の投稿は禁止

if(post.uid === currentUser.uid){

alert("自分の投稿にはいいねできません");

return;

}



const likeRef =
ref(
db,
"board/threads/"
+threadId+
"/posts/"
+postId+
"/likedUsers/"
+currentUser.uid
);



const likeSnap =
await get(likeRef);



if(likeSnap.exists()){

alert("すでにいいねしています");

return;

}



// いいね記録

await set(likeRef,true);



await update(
ref(
db,
"board/threads/"
+threadId+
"/posts/"
+postId
),
{

likes:
(post.likes || 0)+1

}

);
  // いいね報酬

const newLikes =
(post.likes || 0)+1;



const authorRef =
ref(db,"members/"+post.uid);


const authorSnap =
await get(authorRef);



if(authorSnap.exists()){


const author =
authorSnap.val();


let addPoint = 1;



// 10いいねボーナス

if(
newLikes >= 10 &&
!post.likeReward10
){

addPoint += 20;


await update(
ref(
db,
"board/threads/"
+threadId+
"/posts/"
+postId
),
{

likeReward10:true

}

);

}



// 50いいねボーナス

if(
newLikes >= 50 &&
!post.likeReward50
){

addPoint += 200;


await update(
ref(
db,
"board/threads/"
+threadId+
"/posts/"
+postId
),
{

likeReward50:true

}

);

}



// 投稿者へポイント追加

await update(authorRef,{

point:
(author.point || 0)+addPoint

});
  // 通知作成

const notificationRef =
push(
ref(db,"notifications/"+post.uid)
);

await set(notificationRef,{

text:
userName+"さんがあなたの投稿にいいねしました",

point:addPoint,

read:false,

time:Date.now()

});
  await checkMaster(
post.uid,
newLikes
);


}


};
  const rankRef =
ref(db,"members/"+post.uid);


get(rankRef)
.then((snap)=>{


if(snap.exists()){


const member =
snap.val();


const rank =
member.rank || "新人";


const badge =
member.badge || "";



document.getElementById(
"rank-"+postId
).innerHTML =

" ["+rank+"] "+badge;


}


});



posts.appendChild(div);



});


}



});



// 投稿

document
.getElementById("send")
.onclick=async()=>{


const text =
document.getElementById("text").value;



if(text===""){

alert("文字を入力してください");

return;

}



// ユーザー

const uid =
currentUser.uid;


const name =
userName;


// 投稿場所

const postRef =
push(
ref(db,
"board/threads/"+threadId+"/posts")
);



await set(postRef,{

text:text,

uid:uid,

name:name,

time:Date.now()

});
  // 投稿活動記録

await update(
ref(db,"members/"+uid),
{

lastPostDate:Date.now()

}
);
  await updateRank(uid);
  // ポイント報酬処理

const today =
new Date().toLocaleDateString();


const memberRef =
ref(db,"members/"+uid);


const memberSnap =
await get(memberRef);


if(memberSnap.exists()){


const member =
memberSnap.val();


let reward =
member.boardRewardToday || 0;


let rewardDate =
member.boardRewardDate || "";



// 日付が変わったらリセット

if(rewardDate !== today){

reward = 0;

}



// 上限チェック

if(reward < 100){


const addPoint =
Math.min(5,100-reward);



await update(memberRef,{

point:
(member.point || 0)+addPoint,


boardRewardDate:
today,


boardRewardToday:
reward+addPoint


});
await update(memberRef,{

lastPostDate:Date.now()

});


await updateRank(uid);

alert(
"掲示板投稿報酬 +"+addPoint+"pt"
);


}else{


alert(
"今日の掲示板報酬上限に達しています"
);


}



}



document.getElementById("text").value="";



};



</script>


</body>

</html>
