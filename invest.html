<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投資</title>

<style>

body{
    font-family:sans-serif;
    margin:20px;
}

h1{
    margin-bottom:20px;
}

button{
    padding:10px 20px;
    margin:5px;
}

input{
    padding:8px;
    width:180px;
}

#price{
    font-size:28px;
    font-weight:bold;
}

#status{
    font-size:20px;
    color:blue;
}

</style>

</head>

<body>

<h1>投資</h1>

<h2>BTCチャート</h2>

<div id="tradingview_chart"></div>

<hr>

<h2>現在価格</h2>

<div id="price">取得中...</div>

<hr>

<h2>投資</h2>

<input
type="number"
id="bet"
placeholder="投資ポイント">

<br><br>

<button id="longButton">
LONG
</button>

<button id="shortButton">
SHORT
</button>

<hr>

<h2>状態</h2>

<div id="status">

ポジションなし

</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

new TradingView.widget({

container_id:"tradingview_chart",

width:"100%",

height:500,

symbol:"BINANCE:BTCUSDT",

interval:"1",

timezone:"Asia/Tokyo",

theme:"light",

style:"1",

locale:"ja",

toolbar_bg:"#f1f3f6",

hide_top_toolbar:false,

allow_symbol_change:false

});

let position=null;

let entryPrice=0;

let betPoint=0;

async function updatePrice(){

    try{

        const res=await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT");

        const data=await res.json();

        document.getElementById("price").textContent=
        Number(data.price).toLocaleString()+" USDT";

    }

    catch(e){

        console.error(e);

        document.getElementById("price").textContent="取得失敗";

    }

}

updatePrice();

setInterval(updatePrice,5000);
    /* ---------------- LONG ---------------- */

document.getElementById("longButton").onclick = () => {

    if(position){

        alert("すでにポジションを保有しています");

        return;

    }

    betPoint = Number(document.getElementById("bet").value);

    if(betPoint <= 0){

        alert("投資ポイントを入力してください");

        return;

    }

    entryPrice = Number(
        document.getElementById("price").textContent
        .replace(/,/g,"")
        .replace(" USDT","")
    );

   position = "LONG";

document.getElementById("status").textContent =
"LONG保有中（10秒後に自動決済）";

document.getElementById("longButton").disabled = true;
document.getElementById("shortButton").disabled = true;

setTimeout(closePosition,10000);
};


/* ---------------- SHORT ---------------- */

document.getElementById("shortButton").onclick = () => {

    if(position){

        alert("すでにポジションを保有しています");

        return;

    }

    betPoint = Number(document.getElementById("bet").value);

    if(betPoint <= 0){

        alert("投資ポイントを入力してください");

        return;

    }

    entryPrice = Number(
        document.getElementById("price").textContent
        .replace(/,/g,"")
        .replace(" USDT","")
    );

   position = "SHORT";

document.getElementById("status").textContent =
"SHORT保有中（10秒後に自動決済）";

document.getElementById("longButton").disabled = true;
document.getElementById("shortButton").disabled = true;

setTimeout(closePosition,10000);

};


/* ---------------- 自動決済 ---------------- */

async function closePosition(){

    try{

        const res = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT");

        const data = await res.json();

        const exitPrice = Number(data.price);

        let rate = 0;

        if(position==="LONG"){

            rate = (exitPrice-entryPrice)/entryPrice;

        }else{

            rate = (entryPrice-exitPrice)/entryPrice;

        }

        const profit = Math.round(betPoint*rate);

        let text="";

        if(profit>=0){

            text="利益 +" + profit + " pt";

        }else{

            text="損失 " + profit + " pt";

        }

      document.getElementById("status").textContent =
"決済完了　" + text;

alert("10秒経過\n\n"+text);

position = null;
entryPrice = 0;
betPoint = 0;

document.getElementById("longButton").disabled = false;
document.getElementById("shortButton").disabled = false;
    }

    catch(e){

        console.error(e);

        document.getElementById("status").textContent =
        "決済エラー";

    }

}

</script>

</body>

</html>
