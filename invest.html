<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投資</title>

<style>

body{
    font-family:sans-serif;
    margin:20px;
}

h1{
    margin-bottom:20px;
}

button{
    padding:10px 20px;
    margin:5px;
}

input{
    padding:8px;
    width:180px;
}

#price{
    font-size:28px;
    font-weight:bold;
}

#status{
    font-size:20px;
    color:blue;
}

</style>

</head>

<body>

<h1>投資</h1>

<h2>BTCチャート</h2>

<div id="tradingview_chart"></div>

<hr>

<h2>現在価格</h2>

<div id="price">取得中...</div>

<hr>

<h2>投資</h2>

<input
type="number"
id="bet"
placeholder="投資ポイント">

<br><br>

<button id="longButton">
LONG
</button>

<button id="shortButton">
SHORT
</button>

<hr>

<h2>状態</h2>

<div id="status">

ポジションなし

</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import { getDatabase, ref, get, update, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    const firebaseConfig = {
  apiKey: "AIzaSyBgILQJKJOiQ6gIeZPKhbVjdybXS_vsD3Q",
  authDomain: "kamadapoint.firebaseapp.com",
  databaseURL: "https://kamadapoint-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kamadapoint",
  storageBucket: "kamadapoint.firebasestorage.app",
  messagingSenderId: "601769416524",
  appId: "1:601769416524:web:0be49ce5a0baf87f75e1e9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let uid = "";
let myPoint = 0;
    onAuthStateChanged(auth, async (user) => {

    if (!user) {
        location.href = "login.html";
        return;
    }

    uid = user.uid;

    const snap = await get(ref(db, "members/" + uid));

    if (!snap.exists()) {
        alert("ユーザー情報がありません");
        return;
    }

    myPoint = Number(snap.val().point || 0);

    console.log("現在のポイント:", myPoint);

});
new TradingView.widget({

container_id:"tradingview_chart",

width:"100%",

height:500,

symbol:"BINANCE:BTCUSDT",

interval:"1",

timezone:"Asia/Tokyo",

theme:"light",

style:"1",

locale:"ja",

toolbar_bg:"#f1f3f6",

hide_top_toolbar:false,

allow_symbol_change:false

});

let position=null;

let entryPrice=0;

let betPoint=0;

async function updatePrice(){

    try{

        const res=await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT");

        const data=await res.json();

        document.getElementById("price").textContent=
        Number(data.price).toLocaleString()+" USDT";

    }

    catch(e){

        console.error(e);

        document.getElementById("price").textContent="取得失敗";

    }

}

updatePrice();

setInterval(updatePrice,5000);
    /* ---------------- LONG ---------------- */

document.getElementById("longButton").onclick = async () => {
    if(position){

        alert("すでにポジションを保有しています");

        return;

    }

    betPoint = Number(document.getElementById("bet").value);

    if(betPoint <= 0){

        alert("投資ポイントを入力してください");

        return;

    }

    entryPrice = Number(
        document.getElementById("price").textContent
        .replace(/,/g,"")
        .replace(" USDT","")
    );

 const success = await startTrade("LONG");

if(!success){
    return;
}

position = "LONG";

document.getElementById("status").textContent =
"LONG保有中（10秒後に自動決済）";
document.getElementById("longButton").disabled = true;
document.getElementById("shortButton").disabled = true;

setTimeout(closePosition,10000);
};


/* ---------------- SHORT ---------------- */

document.getElementById("shortButton").onclick = async () => {

    if(position){

        alert("すでにポジションを保有しています");

        return;

    }

    betPoint = Number(document.getElementById("bet").value);

    if(betPoint <= 0){

        alert("投資ポイントを入力してください");

        return;

    }

    entryPrice = Number(
        document.getElementById("price").textContent
        .replace(/,/g,"")
        .replace(" USDT","")
    );

  const success = await startTrade("SHORT");

if(!success){
    return;
}

position = "SHORT";

document.getElementById("status").textContent =
"SHORT保有中（10秒後に自動決済）";
document.getElementById("longButton").disabled = true;
document.getElementById("shortButton").disabled = true;

setTimeout(closePosition,10000);

};
  async function startTrade(type){

    // ポイントを減らす
    const userRef = ref(db,"members/" + uid);

    const snap = await get(userRef);

    let currentPoint = Number(snap.val().point || 0);

    if(currentPoint < betPoint){

        alert("ポイント不足です");

        position = null;

        document.getElementById("longButton").disabled = false;
        document.getElementById("shortButton").disabled = false;

        return;
    }

    await update(userRef,{
        point: currentPoint - betPoint
    });


    // ポジション保存
    const tradeRef = push(ref(db,"positions/"+uid));

    await set(tradeRef,{
        type:type,
        bet:betPoint,
        entryPrice:entryPrice,
        startTime:Date.now()
    });

    console.log("取引開始保存");
}
    return true;


/* ---------------- 自動決済 ---------------- */

async function closePosition(){

    try{

        const res = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT");

        const data = await res.json();

        const exitPrice = Number(data.price);

        let rate = 0;

        if(position==="LONG"){

            rate = (exitPrice-entryPrice)/entryPrice;

        }else{

            rate = (entryPrice-exitPrice)/entryPrice;

        }

       const profit = Math.round(betPoint * rate * 5);
        let text="";

        if(profit>=0){

            text="利益 +" + profit + " pt";

        }else{

            text="損失 " + profit + " pt";

        }
        // ポイント更新
const userRef = ref(db, "members/" + uid);

const snap = await get(userRef);

let currentPoint = Number(snap.val().point || 0);

await update(userRef,{
    point: currentPoint + betPoint + profit
});


      document.getElementById("status").textContent =
"決済完了　" + text;

alert("10秒経過\n\n"+text);

position = null;
entryPrice = 0;
betPoint = 0;

document.getElementById("longButton").disabled = false;
document.getElementById("shortButton").disabled = false;
    }

    catch(e){

        console.error(e);

        document.getElementById("status").textContent =
        "決済エラー";

    }

}

</script>

</body>

</html>
