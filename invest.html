<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投資</title>

<style>

body{
    font-family:sans-serif;
    margin:20px;
}

button{
    padding:8px 18px;
    margin:5px;
}

</style>

</head>

<body>

<h1>投資</h1>

<div class="tradingview-widget-container">
  <div id="tradingview_chart"></div>
</div>
<hr>

<h2>現在価格</h2>

<div id="price">取得中...</div>

<hr>

<h2>投資</h2>

<input
type="number"
id="money"
placeholder="投資ポイント">

<br><br>

<button id="buyButton">
買い（LONG）
</button>

<button id="sellButton">
売り（SHORT）
</button>
    <script src="https://s3.tradingview.com/tv.js"></script>

<script>
new TradingView.widget({
    width: "100%",
    height: 600,
    symbol: "FX:USDJPY",
    interval: "1",
    timezone: "Asia/Tokyo",
    theme: "light",
    style: "1",
    locale: "ja",
    container_id: "tradingview_chart"
});
    const widget = document.getElementById("price");

setInterval(() => {

    const price =
        document.querySelector(".tv-symbol-price-quote__value");

    if(price){

        widget.textContent = price.innerText + " 円";

    }

},1000);
</script>

</body>
</html>
