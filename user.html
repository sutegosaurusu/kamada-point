<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザーページ</title>

<style>

body{
    font-family:"Arial","Noto Sans JP",sans-serif;
    margin:0;
    padding:20px;
    background:linear-gradient(135deg,#ffe6f2,#e6f7ff);
    color:#333;
}

h1{
    text-align:center;
    color:#ff5c9a;
    font-size:32px;
    margin-bottom:25px;
}

h2{
    color:#555;
    border-left:6px solid #ff7eb3;
    padding-left:10px;
}

button{
    padding:12px 25px;
    margin:5px;
    border:none;
    border-radius:25px;
    background:linear-gradient(135deg,#ff7eb3,#ff65a3);
    color:white;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(255,100,160,0.3);
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

input,select{
    padding:12px;
    border-radius:15px;
    border:2px solid #ffd1e3;
    background:white;
    font-size:16px;
}

#toast{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:#ff6fae;
    color:white;
    padding:14px 30px;
    border-radius:30px;
    display:none;
    z-index:9999;
    font-size:18px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

#notice{
    margin:15px 0;
    padding:15px;
    border-radius:20px;
    background:#fff;
    border:3px solid #ffe0ef;
    color:#ff4f91;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

#myPoint{
    background:white;
    padding:20px;
    border-radius:25px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#ff5c9a;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

#rankList,
#logList{
    background:white;
    padding:15px;
    border-radius:20px;
    margin-top:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

hr{
    border:none;
    height:2px;
    background:#ffd1e3;
    margin:25px 0;
}

select{
    width:220px;
}

input{
    width:180px;
}

</style>

</head>

<body>

<div id="toast"></div>

<h1>ユーザーページ</h1>

<button id="logoutBtn">ログアウト</button>

<hr>
    <h2>🔔 通知</h2>

<div id="notifications">

通知はありません

</div>

<hr>
<div id="notice">
読み込み中...
</div>
    <hr>
<h2>自分のポイント</h2>

<div id="myPoint">読み込み中...</div>

<hr>

<h2>ポイント譲渡</h2>

<button
onclick="location.href='transfer.html'">

譲渡ページへ

</button>
<hr>
<button onclick="location.href='board.html'">
掲示板を見る
</button>
  <hr>  
  

<h2>🐛 ダンゴムシダンジョン</h2>

<button onclick="location.href='dango/dango.html'">
    探索へ行く
</button>
</button>
     <hr>
<h2>投資</h2>

<button onclick="location.href='invest.html'">
投資ページへ
</button>

<h2>ランキング</h2>

<button id="rankButton">
表示
</button>

<div id="rankList" style="display:none;"></div>
<hr>

<h2>履歴</h2>

<button id="logButton">
表示
</button>

<div id="logList" style="display:none;"></div>
    <hr>
    <h2>ルール</h2>

    <button onclick="location.href='rules.html'">
ルールを見る
</button>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getDatabase,
ref,
get,
onValue,
update,
push
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {

apiKey:"AIzaSyBgILQJKJOiQ6gIeZPKhbVjdybXS_vsD3Q",

authDomain:"kamadapoint.firebaseapp.com",

databaseURL:"https://kamadapoint-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"kamadapoint",

storageBucket:"kamadapoint.firebasestorage.app",

messagingSenderId:"601769416524",

appId:"1:601769416524:web:0be49ce5a0baf87f75e1e9"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getDatabase(app);
    onValue(ref(db,"notice/text"), (snap) => {

  const text = snap.val();

  if(text){
    document.getElementById("notice").textContent = text;
  }else{
    document.getElementById("notice").textContent =
      "現在お知らせはありません";
  }

});

let uid=null;

let myPoint=0;


/* ---------------- ログイン確認 ---------------- */

onAuthStateChanged(auth,async(user)=>{

if(!user){

location.href="login.html";

return;

}

uid=user.uid;
/* ---------- いいね通知 ---------- */

onValue(ref(db,"notifications/"+uid),snap=>{

  const box = document.getElementById("notifications");
  box.innerHTML = "";

  if(!snap.exists()){
    box.textContent = "通知はありません";
    return;
  }

  const list = [];

  snap.forEach(child=>{
    list.push({
      id: child.key,
      ...child.val()
    });
  });

  list.sort((a,b)=>b.time-a.time);

  list.forEach(async(n)=>{
if(n.read){
    return;
}
    const div = document.createElement("div");

    div.className = "card";

    div.innerHTML = `
      <b>${n.text}</b><br>
     ${n.point ? "+"+n.point+"pt" : ""}
      <br>
      <small>${new Date(n.time).toLocaleString()}</small>
    `;

    box.appendChild(div);

    if(!n.read){
      await update(
        ref(db,"notifications/"+uid+"/"+n.id),
        {read:true}
      );
    }

  });if(box.innerHTML===""){
    box.textContent="通知はありません";
}

});
const snap=await get(ref(db,"members/"+uid));

if(!snap.exists()){

location.href="login.html";

return;

}

const data=snap.val();

if(data.banned===true){

alert("BANされています");

await signOut(auth);

location.href="login.html";

return;

}

myPoint=Number(data.point||0);

document.getElementById("myPoint").textContent=
myPoint+" pt";

/* ---------- 自分のポイントをリアルタイム更新 ---------- */

onValue(ref(db,"members/"+uid),snap=>{

const d=snap.val();

if(!d)return;

myPoint=Number(d.point||0);

document.getElementById("myPoint").textContent=
myPoint+" pt";

});


/* ---------------- ログアウト ---------------- */

document.getElementById("logoutBtn").onclick=async()=>{

await signOut(auth);

location.href="login.html";

};/* ---------------- ランキング ---------------- */

document.getElementById("rankButton").onclick = () => {

  const box = document.getElementById("rankList");
  const btn = document.getElementById("rankButton");

  if(box.style.display==="block"){

    box.style.display="none";
    btn.textContent="表示";
    return;

  }

  box.style.display="block";
  btn.textContent="非表示";

  onValue(ref(db, "members"), snap => {

    const data = snap.val() || {};

    box.innerHTML = "";

    const arr = Object.entries(data)
      .filter(([id,u]) => u.banned !== true)
      .map(([id,u]) => ({
        uid:id,
        name:u.name,
        point:Number(u.point || 0)
      }))
      .sort((a,b)=>b.point-a.point);

    arr.forEach((u,i)=>{

      const div=document.createElement("div");

      div.textContent=
      `${i+1}位　${u.name}　${u.point}pt`;

      box.appendChild(div);

    });

  });

};


/* ---------------- 履歴 ---------------- */

document.getElementById("logButton").onclick=()=>{

  const box=document.getElementById("logList");
  const btn=document.getElementById("logButton");

  if(box.style.display==="block"){

    box.style.display="none";
    btn.textContent="表示";
    return;

  }

  box.style.display="block";
  btn.textContent="非表示";

  onValue(ref(db,"logs/"+uid),snap=>{

    const data=snap.val()||{};

    box.innerHTML="";

    Object.values(data)
      .sort((a,b)=>b.time-a.time)
      .forEach(l=>{

        const div=document.createElement("div");

        div.textContent=
        `${l.action}　${new Date(l.time).toLocaleString()}`;

        box.appendChild(div);

      });

  });

};




/* ---------------- 通知 ---------------- */

function showToast(message){

  const toast=document.getElementById("toast");

  toast.textContent=message;

  toast.style.display="block";

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{

    toast.style.display="none";

  },3000);

}
});
</script>

</body>
</html>
