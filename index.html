<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン判定</title>
</head>

<body>

<h1>ログイン中...</h1>
<div id="status">確認しています</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgILQJKJOiQ6gIeZPKhbVjdybXS_vsD3Q",
  authDomain: "kamadapoint.firebaseapp.com",
  databaseURL: "https://kamadapoint-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kamadapoint",
  storageBucket: "kamadapoint.firebasestorage.app",
  messagingSenderId: "601769416524",
  appId: "1:601769416524:web:0be49ce5a0baf87f75e1e9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

onAuthStateChanged(auth, async (user) => {

  const status = document.getElementById("status");

  if (!user) {
    status.textContent = "未ログインです";
    location.href = "login.html";
    return;
  }

  status.textContent = "権限確認中...";

  const snap = await get(ref(db, "members/" + user.uid));

  if (!snap.exists()) {
    status.textContent = "ユーザーデータなし";
    return;
  }

  const data = snap.val();

  // BANチェック
  if (data.banned === true) {
    status.textContent = "BANされています";
    return;
  }

  // 管理者判定
  if (data.admin === true) {
    status.textContent = "管理者ページへ移動";
    location.href = "admin.html";
  } else {
    status.textContent = "ユーザーページへ移動";
    location.href = "user.html";
  }
});

</script>

</body>
</html>
