<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ダンゴムシポリス</title>


<style>

body{

font-family:"Arial","Noto Sans JP",sans-serif;

margin:0;

padding:20px;

background:linear-gradient(135deg,#f5e6c8,#dff3ff);

color:#333;

}


h1{

}

border-radius:20px;

margin:15px 0;

}



#bug{

font-size:70px;

text-align:center;

}



button{

padding:12px 25px;

border:none;

border-radius:25px;

background:#b8863b;

color:white;

font-weight:bold;

cursor:pointer;

}

transform:translateY(-2px);

}

padding:10px;

border-radius:15px;

}



#status{

}



.item{

}



</style>


</head>



<body>


<h1>
🏛 ダンゴムシポリス
</h1>



<div class="card">


<div id="bug">

🪲

</div>


<h2>
探索者
</h2>


<p>
名前：
市民探索隊
</p>


<p>
階級：
新人探索者
</p>


</div>





<div class="card">


<h2>
🎒 倉庫
</h2>


<div class="item">

🍂 落ち葉：
<span id="leaf">
0
</span>

</div>


<div class="item">

🍎 野生果実：
<span id="fruit">
0
</span>

</div>


<div class="item">

🍄 キノコ：
<span id="mushroom">
0
</span>

</div>


</div>






<div class="card">


<h2>
🌳 探索地
</h2>


<select id="place">


<option value="olive">

オリーブ森

（果実1個必要）

</option>


</select>



<br><br>


<button id="start">

探索開始

</button>


<button onclick="location.href='user.html'">

戻る

</button>


</div>






<div class="card">


<h2>
状態
</h2>


<div id="status">

待機中

</div>


<p id="result">

まだ探索していません

</p>


</div>







<script type="module">


import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";



import {

getAuth,

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";



import {

getDatabase,

ref,

get,

set,

update

}

from

"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";





const firebaseConfig={


apiKey:"AIzaSyBgILQJKJOiQ6gIeZPKhbVjdybXS_vsD3Q",

authDomain:"kamadapoint.firebaseapp.com",

databaseURL:"https://kamadapoint-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"kamadapoint",

storageBucket:"kamadapoint.firebasestorage.app",

messagingSenderId:"601769416524",

appId:"1:601769416524:web:0be49ce5a0baf87f75e1e9"


};



const app=initializeApp(firebaseConfig);


const auth=getAuth(app);


const db=getDatabase(app);




let uid=null;




onAuthStateChanged(auth,async(user)=>{


if(!user){


location.href="login.html";


return;


}



uid=user.uid;



await loadInventory();


});







// --------------------
// 所持品読み込み
// --------------------


async function loadInventory(){



const snap=await get(

ref(db,"dangoInventory/"+uid)

);



if(!snap.exists()){



await set(

ref(db,"dangoInventory/"+uid),

{

leaf:0,

fruit:5,

mushroom:0

}

);



document.getElementById("fruit").textContent=5;



return;


}




const data=snap.val();



document.getElementById("leaf").textContent=

data.leaf||0;



document.getElementById("fruit").textContent=

data.fruit||0;



document.getElementById("mushroom").textContent=

data.mushroom||0;



}






// --------------------
// 探索開始
// --------------------


document.getElementById("start").onclick=async()=>{



const invSnap=await get(

ref(db,"dangoInventory/"+uid)

);



const inv=invSnap.val();



if(inv.fruit < 1){


alert("果実が足りません");


return;


}



let now=Date.now();



// テスト用10秒

let endTime=

now+10000;



await update(

ref(db,"dangoInventory/"+uid),

{

fruit:inv.fruit-1

}

);



await set(

ref(db,"dangoExplore/"+uid),

{


place:"olive",

startTime:now,

endTime:endTime,

status:"running"


}

);



document.getElementById("fruit").textContent=

inv.fruit-1;



document.getElementById("status").textContent=

"探索中…";



document.getElementById("result").textContent=

"オリーブ森へ向かいました";



};


// --------------------
// 探索結果確認
// --------------------

async function checkExplore(){


const snap = await get(

ref(db,"dangoExplore/"+uid)

);



if(!snap.exists()){

return;

}



const data=snap.val();



const now=Date.now();



// まだ探索中

if(now < data.endTime){


let remain=Math.ceil(

(data.endTime-now)/1000

);


document.getElementById("status").textContent=

"探索中… 残り "+remain+"秒";


return;


}




// 帰還処理

if(data.status==="finished"){

return;

}



await finishExplore(data);



}





// --------------------
// 探索成功
// --------------------


async function finishExplore(data){



let reward={



leaf:10,

mushroom:2



};



const invSnap=await get(

ref(db,"dangoInventory/"+uid)

);



let inv=invSnap.val();





inv.leaf=

Number(inv.leaf||0)+reward.leaf;



inv.mushroom=

Number(inv.mushroom||0)+reward.mushroom;





await set(

ref(db,"dangoInventory/"+uid),

inv

);





await update(

ref(db,"dangoExplore/"+uid),

{


status:"finished"


}

);





document.getElementById("leaf").textContent=

inv.leaf;



document.getElementById("mushroom").textContent=

inv.mushroom;





document.getElementById("status").textContent=

"探索終了！";



document.getElementById("result").textContent=

"🌳オリーブ森から帰還しました！\n\n🍂落ち葉 ×10\n🍄キノコ ×2";



}







// --------------------
// 3秒ごと確認
// --------------------


setInterval(()=>{


if(uid){

checkExplore();

}


},3000);
