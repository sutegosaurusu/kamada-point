<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>鎌田P掲示板</title>

<style>

body{
    font-family:"Arial","Noto Sans JP",sans-serif;
    margin:0;
    padding:20px;
    background:linear-gradient(135deg,#ffe6f2,#e6f7ff);
}

h1{
    text-align:center;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:25px;
    background:#ff8fcf;
    color:white;
    cursor:pointer;
    margin:5px;
}

button:hover{
    opacity:0.8;
}

.card{

    background:white;
    padding:15px;
    margin:15px 0;
    border-radius:15px;
    box-shadow:0 3px 10px #ccc;

}

.title{

    font-size:20px;
    font-weight:bold;

}

.info{

    color:#666;
    font-size:14px;

}
    .categoryBox{

background:white;
padding:15px;
margin:20px 0;
border-radius:15px;
box-shadow:0 3px 10px #ccc;

}

.categoryBox h2{

margin-top:0;

}

</style>

</head>


<body>


<h1>鎌田P掲示板</h1>


<button onclick="location.href='createThread.html'">
スレを作成
</button>


<button onclick="location.href='user.html'">
戻る
</button>


<hr>
<div>

<button id="categoryBtn">
📂 カテゴリ別
</button>

<button id="timeBtn">
🕒 時間順
</button>

</div>

<div id="threads">

<div class="categoryBox" id="notice">
<h2>📢 お知らせ</h2>
</div>

<div class="categoryBox" id="chat">
<h2>💬 雑談</h2>
</div>

<div class="categoryBox" id="point">
<h2>💰 鎌田ポイント</h2>
</div>

<div class="categoryBox" id="game">
<h2>🎮 ゲーム</h2>
</div>

<div class="categoryBox" id="improve">
<h2>💡 改善</h2>
</div>

<div class="categoryBox" id="question">
<h2>❓ 質問</h2>
</div>

<div class="categoryBox" id="bug">
<h2>🐛 不具合報告</h2>
</div>

</div>


<script type="module">


console.log("掲示板のJavaScript開始");

// Firebase SDK

import { initializeApp }
from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 
getDatabase,
ref,
onValue,
get
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";




const firebaseConfig = {

apiKey:"AIzaSyBgILQJKJOiQ6gIeZPKhbVjdybXS_vsD3Q",

authDomain:"kamadapoint.firebaseapp.com",

databaseURL:"https://kamadapoint-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"kamadapoint",

storageBucket:"kamadapoint.firebasestorage.app",

messagingSenderId:"601769416524",

appId:"1:601769416524:web:0be49ce5a0baf87f75e1e9"

};





// Firebase開始

const app =
initializeApp(firebaseConfig);


const db =
getDatabase(app);

let mode = "category";


// 表示場所

const threadsDiv =
document.getElementById("threads");


document.getElementById("categoryBtn").onclick=()=>{

mode="category";
loadThreads();

};


document.getElementById("timeBtn").onclick=()=>{

mode="time";
loadThreads();

};

// スレ取得

const threadsRef =
ref(db,"board/threads");
    console.log("読み込み開始");


function loadThreads(){
onValue(threadsRef,(snapshot)=>{

console.log("Firebase取得成功");
console.log(snapshot.val());



const now = Date.now();


let count = 0;
let threadList = [];

snapshot.forEach((child)=>{

threadList.push({
id: child.key,
data: child.val()
});

});
threadList.forEach((item)=>{

const id = item.id;
const data = item.data;

count++;

const div =
document.createElement("div");


});


// 3日以上前は表示しない





const div =
document.createElement("div");


div.className="card";



div.innerHTML = `

<div class="title">

${data.title || "タイトルなし"}

</div>


<p>
カテゴリー：
${data.category || "未設定"}
</p>


<p class="info">

投稿者：
${data.name || "名無し"}

<span id="rank-${id}"></span>

<br>

日時：
${new Date(data.createdAt)
.toLocaleString()}

</p>


<p>

👍 ${data.likes || 0}

</p>



<button>

スレを見る

</button>


`;



div.querySelector("button")
.onclick=()=>{


location.href =
"thread.html?id="+id;


};
    const rankRef =
ref(db,"members/"+data.uid);


get(rankRef)
.then((snap)=>{


if(snap.exists()){


const member =
snap.val();


document.getElementById(
"rank-"+id
).innerHTML =

" ["+
(member.rank || "新人")
+"] "+
(member.badge || "");


}

});



let box;


switch(data.category){

case "お知らせ":
box=document.getElementById("notice");
break;


case "雑談":
box=document.getElementById("chat");
break;


case "鎌田ポイント":
box=document.getElementById("point");
break;


case "ゲーム":
box=document.getElementById("game");
break;


case "改善":
box=document.getElementById("improve");
break;


case "質問":
box=document.getElementById("question");
break;


case "不具合報告":
box=document.getElementById("bug");
break;


default:
box=threadsDiv;

}


box.appendChild(div);



});



if(count===0){

threadsDiv.innerHTML=

"表示できるスレはありません";

}

loadThreads();
});
    


</script>


</body>

</html>
