<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>鎌田P掲示板</title>

<style>

body{
    font-family:"Arial","Noto Sans JP",sans-serif;
    margin:0;
    padding:20px;
    background:linear-gradient(135deg,#ffe6f2,#e6f7ff);
}

h1{
    text-align:center;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:25px;
    background:#ff8fcf;
    color:white;
    cursor:pointer;
    margin:5px;
}

button:hover{
    opacity:0.8;
}

.card{

    background:white;
    padding:8px 12px;
    margin:6px 0;
    border-radius:8px;
    box-shadow:0 1px 4px #ddd;

}


.title{

    font-size:16px;
    font-weight:bold;
    margin-bottom:3px;

}


.info{

    color:#777;
    font-size:12px;
    line-height:1.3;
    margin:2px 0;

}
    .categoryBox{

background:white;
padding:15px;
margin:20px 0;
border-radius:15px;
box-shadow:0 3px 10px #ccc;

}

.categoryBox h2{

margin-top:0;

}
    #categoryBtn.active,
#timeBtn.active{
    background:#e754a6;
    box-shadow:0 3px 8px rgba(0,0,0,0.2);
}

#threads{
    max-width:900px;
    margin:0 auto;
}

.categoryBox{
    background:rgba(255,255,255,0.8);
}

.categoryBox .card{
    border:1px solid #f1d7e6;
    box-shadow:0 2px 6px #ddd;
}
.category{

    font-size:12px;
    color:#777;
    margin:2px 0;

}
    .card{
    background:white;
    padding:8px 12px;
    margin:6px 0;
    border-radius:8px;
    box-shadow:0 1px 4px #ddd;
    cursor:pointer;
    transition:0.15s;
}

.card:hover{
    background:#fff8fc;
}
</style>

</head>


<body>


<h1>鎌田P掲示板</h1>


<button onclick="location.href='createThread.html'">
スレを作成
</button>


<button onclick="location.href='user.html'">
戻る
</button>


<hr>
<div>

<button id="categoryBtn">
📂 カテゴリ別
</button>

<button id="timeBtn">
🕒 時間順
</button>

</div>

<div id="threads">

<div class="categoryBox" id="notice">
<h2>📢 お知らせ</h2>
</div>

<div class="categoryBox" id="chat">
<h2>💬 雑談</h2>
</div>

<div class="categoryBox" id="point">
<h2>💰 鎌田ポイント</h2>
</div>

<div class="categoryBox" id="game">
<h2>🎮 ゲーム</h2>
</div>

<div class="categoryBox" id="improve">
<h2>💡 改善</h2>
</div>

<div class="categoryBox" id="question">
<h2>❓ 質問</h2>
</div>

<div class="categoryBox" id="bug">
<h2>🐛 不具合報告</h2>
</div>

</div>


<script type="module">


console.log("掲示板のJavaScript開始");

// Firebase SDK

import { initializeApp }
from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 
getDatabase,
ref,
onValue,
get
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";




const firebaseConfig = {

apiKey:"AIzaSyBgILQJKJOiQ6gIeZPKhbVjdybXS_vsD3Q",

authDomain:"kamadapoint.firebaseapp.com",

databaseURL:"https://kamadapoint-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"kamadapoint",

storageBucket:"kamadapoint.firebasestorage.app",

messagingSenderId:"601769416524",

appId:"1:601769416524:web:0be49ce5a0baf87f75e1e9"

};





// Firebase開始

const app =
initializeApp(firebaseConfig);


const db =
getDatabase(app);

let mode = "category";
let threadList = [];

const threadsDiv =
document.getElementById("threads");

const categoryBtn =
document.getElementById("categoryBtn");

const timeBtn =
document.getElementById("timeBtn");

const threadsRef =
ref(db,"board/threads");


// カテゴリ別ボタン
categoryBtn.onclick=()=>{

mode="category";
renderThreads();

};


// 時間順ボタン
timeBtn.onclick=()=>{

mode="time";
renderThreads();

};


// Firebaseからスレを取得
onValue(threadsRef,(snapshot)=>{

console.log("Firebase取得成功");
console.log(snapshot.val());

threadList=[];

snapshot.forEach((child)=>{

threadList.push({

id:child.key,
data:child.val()

});

});


// 新しい順に並べる
threadList.sort((a,b)=>{

return (b.data.createdAt || 0)
-
(a.data.createdAt || 0);

});

renderThreads();

},(error)=>{

console.error("スレ取得エラー",error);

threadsDiv.innerHTML=
"<p>スレの読み込みに失敗しました。</p>";

});


// 全体を表示
function renderThreads(){

threadsDiv.innerHTML="";

categoryBtn.classList.toggle(
"active",
mode==="category"
);

timeBtn.classList.toggle(
"active",
mode==="time"
);


if(threadList.length===0){

threadsDiv.innerHTML=
"<p>表示できるスレはありません。</p>";

return;

}


if(mode==="category"){

renderCategoryMode();

}else{

renderTimeMode();

}

}


// カテゴリ別表示
function renderCategoryMode(){

const categories=[

{
name:"お知らせ",
icon:"📢",
id:"notice"
},

{
name:"雑談",
icon:"💬",
id:"chat"
},

{
name:"鎌田ポイント",
icon:"💰",
id:"point"
},

{
name:"ゲーム",
icon:"🎮",
id:"game"
},

{
name:"実況",
icon:"📣",
id:"live"
},

{
name:"趣味",
icon:"🎨",
id:"hobby"
},

{
name:"改善",
icon:"💡",
id:"improve"
},

{
name:"質問",
icon:"❓",
id:"question"
},

{
name:"不具合報告",
icon:"🐛",
id:"bug"
},

{
name:"未設定",
icon:"📁",
id:"other"
}

];


categories.forEach((category)=>{

const items=
threadList.filter((item)=>{

const itemCategory=
item.data.category || "未設定";

if(category.name==="未設定"){

return !categories.some((known)=>{

return known.name!=="未設定"
&&
known.name===itemCategory;

});

}

return itemCategory===category.name;

});


if(items.length===0){

return;

}


const section=
createSection(

category.icon+" "+category.name,
items.length

);


items.forEach((item)=>{

section.appendChild(
createThreadCard(item)
);

});


threadsDiv.appendChild(section);

});

}


// 時間順表示
function renderTimeMode(){

const groups={

"今日":[],
"1日前":[],
"2日前":[],
"3日前":[],
"4日以上前":[]

};


threadList.forEach((item)=>{

const days=
getDaysAgo(item.data.createdAt);


if(days===0){

groups["今日"].push(item);

}else if(days===1){

groups["1日前"].push(item);

}else if(days===2){

groups["2日前"].push(item);

}else if(days===3){

groups["3日前"].push(item);

}else{

groups["4日以上前"].push(item);

}

});


Object.entries(groups)
.forEach(([title,items])=>{

if(items.length===0){

return;

}


const section=
createSection(
"🕒 "+title,
items.length
);


items.forEach((item)=>{

section.appendChild(
createThreadCard(item)
);

});


threadsDiv.appendChild(section);

});

}


// 今日から何日前かを計算
function getDaysAgo(createdAt){

const timestamp=
Number(createdAt);


if(!timestamp){

return 9999;

}


const today=
new Date();

today.setHours(0,0,0,0);


const createdDate=
new Date(timestamp);

createdDate.setHours(0,0,0,0);


return Math.floor(

(today.getTime()
-
createdDate.getTime())

/
(1000*60*60*24)

);

}


// 分類の箱を作る
function createSection(title,count){

const section=
document.createElement("section");

section.className="categoryBox";


const heading=
document.createElement("h2");

heading.textContent=
title+"（"+count+"件）";


section.appendChild(heading);

return section;

}


// スレカードを作る
function createThreadCard(item){

const id=item.id;
const data=item.data;

const div=
document.createElement("div");

div.className="card";
div.style.cursor = "pointer";

div.onclick = () => {
    location.href =
    "thread.html?id=" +
    encodeURIComponent(id);
};

const createdAt=
Number(data.createdAt);

const dateText=
createdAt

? new Date(createdAt)
.toLocaleString("ja-JP")

: "日時不明";


div.innerHTML=`

<div class="title"></div>

<p class="category"></p>

<p class="info">

投稿者：
<span class="author"></span>

<span class="rank"></span>

<br>

日時：
<span class="date"></span>

</p>

`;


div.querySelector(".title")
.textContent=
data.title || "タイトルなし";


div.querySelector(".category")
.textContent=
"カテゴリー："+
(data.category || "未設定");


div.querySelector(".author")
.textContent=
data.name || "名無し";


div.querySelector(".date")
.textContent=
dateText;


if(data.uid){

const rankRef =
ref(db,"members/"+data.uid);


get(rankRef)
.then((snap)=>{


if(!snap.exists()){

return;

}


const member =
snap.val();


const rankSpan =
div.querySelector(".rank");


rankSpan.textContent =

" ["+
(member.rank || "新人")
+"] "+
(member.badge || "");


})
.catch((error)=>{

console.error(
"ランク取得エラー",
error
);

});

}


return div;

}
</script>


</body>

</html>
