<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>スレ作成</title>


<style>

body{

font-family:"Arial","Noto Sans JP",sans-serif;
padding:20px;
background:linear-gradient(135deg,#ffe6f2,#e6f7ff);

}


.card{

background:white;
padding:20px;
border-radius:15px;

}


input,select,textarea{

width:90%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;

}


button{

padding:12px 25px;
border:none;
border-radius:25px;
background:#ff8fcf;
color:white;

}


</style>


</head>


<body>


<h1>スレを作成</h1>


<div class="card">


<input id="title" placeholder="スレタイトル">


<br>


<select id="category">

<option value="お知らせ">
📢 お知らせ
</option>

<option value="雑談">
💬 雑談
</option>

<option value="鎌田ポイント">
💰 鎌田ポイント
</option>

<option value="ゲーム">
🎮 ゲーム
</option>

<option value="改善">
💡 改善
</option>

<option value="質問">
❓ 質問
</option>

<option value="不具合報告">
🐛 不具合報告
</option>

</select>


<br>


<button id="create">

作成する

</button>


</div>



<button onclick="location.href='board.html'">

戻る

</button>




<script type="module">


import { initializeApp }

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getDatabase,
ref,
push,
set,
get,
update

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


import {

getAuth,
onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



// Firebase設定

const firebaseConfig = {

apiKey:"AIzaSyBgILQJKJOiQ6gIeZPKhbVjdybXS_vsD3Q",

authDomain:"kamadapoint.firebaseapp.com",

databaseURL:"https://kamadapoint-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"kamadapoint",

storageBucket:"kamadapoint.firebasestorage.app",

messagingSenderId:"601769416524",

appId:"1:601769416524:web:0be49ce5a0baf87f75e1e9"

};



const app =
initializeApp(firebaseConfig);


const db =
getDatabase(app);
const auth =
getAuth(app);


let currentUser = null;


let userName = "名無し";



onAuthStateChanged(auth,async(user)=>{


if(!user){

alert("ログインしてください");

location.href="login.html";

return;

}


currentUser = user;



const userRef =
ref(db,"members/"+user.uid);



const snap =
await get(userRef);



if(snap.exists()){

userName =
snap.val().name;

}



});



document
.getElementById("create")
.onclick=async()=>{


const title =
document.getElementById("title").value;


const category =
document.getElementById("category").value;



if(title===""){

alert("タイトルを入力してください");

return;

}



// ユーザー

const uid =
currentUser.uid;


const name =
userName;



// スレID作成

const threadRef =
push(ref(db,"board/threads"));



await set(threadRef,{


title:title,

category:category,

uid:uid,

name:name,

createdAt:Date.now(),

likes:0



});
// 1日1回スレ作成報酬

const memberRef =
ref(db,"members/"+uid);


const memberSnap =
await get(memberRef);


if(memberSnap.exists()){

const member =
memberSnap.val();


const today =
new Date().toLocaleDateString();


const rewardDate =
member.threadRewardDate || "";


// 日付が変わったら受取可能
if(rewardDate !== today){


await update(memberRef,{

point:
(member.point || 0)+50,

threadRewardDate:
today

});


alert("スレ作成報酬 +50pt");


}else{


alert("今日はスレ作成報酬を受け取り済みです");


}


}


alert("スレを作成しました");


location.href="board.html";


};



</script>


</body>

</html>
